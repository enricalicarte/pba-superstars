name: Actualizar partidos desde Drive

on:
  schedule:
    - cron: '17 */2 * * *'   # cada 2 horas
  workflow_dispatch:          # botón "Run workflow" para actualizar al momento
  push:
    branches: [main]
    paths:
      - '.github/workflows/partidos.yml'
      - 'partidos/scripts/**'

permissions:
  contents: write

concurrency:
  group: partidos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leer la carpeta de Drive
        run: python3 partidos/scripts/actualizar.py
      - name: Guardar la lista si ha cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add partidos/data.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Partidos: lista actualizada desde Drive"
          git push

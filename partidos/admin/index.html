<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Anguera TV · Panel</title>
<meta name="theme-color" content="#07090c">
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../firebase-config.js"></script>
<style>
:root{--bg:#07090c;--s1:#12161c;--s2:#1b2028;--line:rgba(255,255,255,.09);--ink:#f4f5f7;--mute:#a7b0bc;--acc:#2F45D6;--accT:#9DAEFF;--hi:#FFD21F}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
.cond{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.01em}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:#07090cf2;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header img{width:30px;height:31px;border-radius:6px}
header h1{margin:0;font:900 21px/1 'Barlow Condensed',sans-serif;text-transform:uppercase}
header h1 small{color:var(--accT);font-size:15px;margin-left:4px}
.sp{flex:1}
.btn{border:0;border-radius:10px;padding:9px 14px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer}
.btn.ghost{background:#ffffff14}
main{max-width:1100px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom))}
.banner{background:#3a2d00;border:1px solid #7a5d00;color:#ffe48a;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.ranges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ranges button{border:1px solid var(--line);background:var(--s1);border-radius:20px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer}
.ranges button.on{background:var(--acc);border-color:var(--acc)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:14px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{display:block;font:900 32px/1 'Barlow Condensed',sans-serif}
.kpi span{color:var(--mute);font-size:13px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:12px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h2{margin:0 0 2px;font:800 19px/1.1 'Barlow Condensed',sans-serif;text-transform:uppercase}
.card .sub{color:var(--mute);font-size:13px;margin-bottom:10px}
.wide{grid-column:1/-1}
/* barras verticales */
.cols{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:16px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.col i{display:block;width:100%;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.col.top i{background:var(--hi)}
.col em{position:absolute;top:-2px;font-style:normal;font-size:10px;color:var(--mute);transform:translateY(-100%)}
.labels{display:flex;gap:3px;margin-top:4px}
.labels span{flex:1;text-align:center;font-size:10px;color:var(--mute);white-space:nowrap;overflow:visible}
/* mapa de calor */
.heat{display:grid;grid-template-columns:28px repeat(24,1fr);gap:2px;font-size:10px;color:var(--mute)}
.heat div{aspect-ratio:1;border-radius:3px;background:#ffffff0a}
.heat .lb{background:none;aspect-ratio:auto;display:flex;align-items:center}
.heat .hh{background:none;aspect-ratio:auto;text-align:center}
/* barras horizontales */
.rows{display:flex;flex-direction:column;gap:8px}
.row .nm{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:3px}
.row .nm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.row .nm span:last-child{color:var(--mute);flex:none}
.bar{height:8px;background:#ffffff0d;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;color:var(--mute);font-weight:600;font-size:12px;padding:4px 6px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
td:first-child{font-weight:600;line-height:1.2}
.q{display:inline-flex;gap:2px;vertical-align:middle}
.q i{width:14px;height:14px;border-radius:3px;background:var(--acc)}
.tw{overflow-x:auto}
@media(max-width:560px){.hide-s{display:none}th,td{padding:7px 4px}}
.feed{display:flex;flex-direction:column;gap:6px;font-size:13px;max-height:320px;overflow:auto}
.feed div{display:flex;gap:8px}
.feed time{color:var(--mute);flex:none;width:92px}
.center{min-height:70vh;display:grid;place-items:center;text-align:center;gap:14px}
.center p{color:var(--mute);max-width:360px}
.empty{color:var(--mute);font-size:14px;padding:12px 0}
.foot{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<header>
  <img src="../icons/escudo.png" alt="">
  <h1>Anguera TV <small>Panel</small></h1>
  <div class="sp"></div>
  <button class="btn ghost" id="out" hidden>Salir</button>
</header>
<main id="app"><div class="center"><p>Cargando…</p></div></main>

<script type="module">
const FB = window.ATV_FB || {};
const ADMIN = (window.ATV_ADMIN || '').toLowerCase();
const TZ = 'Europe/Madrid';
const DOW = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app = $('#app');
let RANGE = 30, EVENTS = [], DEMO = false, fs = null;

// ---- fechas en hora de Barcelona ----
const fmt = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', hourCycle:'h23', weekday:'short' });
const WK = { Mon:0, Tue:1, Wed:2, Thu:3, Fri:4, Sat:5, Sun:6 };
function parts(d){
  const o = {}; for (const p of fmt.formatToParts(d)) o[p.type] = p.value;
  return { day: o.year + '-' + o.month + '-' + o.day, h: +o.hour, w: WK[o.weekday] };
}
const dayLabel = k => { const [y, m, d] = k.split('-'); return +d + '/' + +m; };
const timeLabel = d => d.toLocaleString('es-ES', { timeZone: TZ, day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });

// ---- datos de ejemplo cuando aún no hay Firebase ----
function sample(){
  const ms = [['j1-anguera-vs-buf','Anguera vs Bufalà'],['j2-badalona-vs-anguera','Badalona vs Anguera'],['j3-anguera-vs-lloreda','Anguera vs Lloreda'],['j4-sistrells-vs-anguera','Sistrells vs Anguera'],['j5-anguera-vs-racing','Anguera vs Racing']];
  const out = []; const now = Date.now();
  for (let i = 0; i < 260; i++){
    const daysAgo = Math.floor(Math.random() * 60);
    const wk = Math.random();
    const hour = wk < .45 ? 20 + Math.floor(Math.random() * 3) : wk < .75 ? 13 + Math.floor(Math.random() * 3) : 8 + Math.floor(Math.random() * 14);
    const t = new Date(now - daysAgo * 864e5); t.setHours(hour, Math.floor(Math.random() * 60));
    if (t > now) continue;
    const s = Math.random().toString(36).slice(2, 10), dv = Math.random() < .82 ? 'm' : Math.random() < .5 ? 't' : 'd', ap = Math.random() < .35;
    const r = Math.random() < .5 ? 'web.whatsapp.com' : '';
    let ts = +t; const ev = (p, n, k) => { out.push({ p, n, k, s, dv, app: ap, r: out.length && out[out.length - 1].s === s ? '' : r, ts: new Date(ts) }); ts += 40e3 + Math.random() * 300e3; };
    ev('/', 'Inicio', 'page');
    const m = ms[Math.min(ms.length - 1, Math.floor(Math.random() ** 1.6 * ms.length))];
    ev('/partido/' + m[0], m[1] + ' · T26/27 S8', 'page');
    const nq = 1 + Math.floor(Math.random() * 4);
    for (let q = 1; q <= nq; q++) ev('ver/' + m[0] + '/' + q, 'Ver ' + m[1] + ' · Q' + q, 'ver');
    if (Math.random() < .3) ev('gol/' + m[0], 'Gol · ' + m[1], 'gol');
    if (Math.random() < .2) ev('/temporada', 'Temporada', 'page');
  }
  return out.sort((a, b) => a.ts - b.ts);
}

// ---- análisis ----
function analyse(evs){
  const since = RANGE ? Date.now() - RANGE * 864e5 : 0;
  evs = evs.filter(e => +e.ts >= since);
  const ses = new Map();
  for (const e of evs){ if (!ses.has(e.s)) ses.set(e.s, { first: e, evs: [] }); ses.get(e.s).evs.push(e); }
  const S = [...ses.values()];
  const byDay = new Map(), byHour = Array(24).fill(0), byDow = Array(7).fill(0), heat = Array.from({ length: 7 }, () => Array(24).fill(0));
  const dev = { m: 0, t: 0, d: 0 }, refs = new Map(); let inApp = 0;
  for (const s of S){
    const p = parts(s.first.ts);
    byDay.set(p.day, (byDay.get(p.day) || 0) + 1); byHour[p.h]++; byDow[p.w]++; heat[p.w][p.h]++;
    dev[s.first.dv] = (dev[s.first.dv] || 0) + 1; if (s.first.app) inApp++;
    const r = s.evs.find(e => e.r)?.r || 'Directo / app';
    refs.set(r, (refs.get(r) || 0) + 1);
  }
  // partidos
  const M = new Map();
  const mm = slug => { if (!M.has(slug)) M.set(slug, { slug, title: slug, open: 0, ses: new Set(), q: [0,0,0,0,0,0], ver: 0, gol: 0 }); return M.get(slug); };
  const Q = [0,0,0,0,0,0];
  for (const e of evs){
    if (e.k === 'page' && e.p.startsWith('/partido/')){ const m = mm(e.p.slice(9)); m.open++; m.ses.add(e.s); m.title = e.n.replace(/ · .*$/, '') || m.title; }
    else if (e.k === 'ver'){ const [, slug, n] = e.p.split('/'); const m = mm(slug); m.ver++; m.ses.add(e.s); const i = Math.min(5, (+n || 1) - 1); m.q[i]++; Q[i]++; }
    else if (e.k === 'gol'){ const m = mm(e.p.slice(4)); m.gol++; }
  }
  const matches = [...M.values()].sort((a, b) => b.ses.size - a.ses.size || b.ver - a.ver);
  return {
    evs, S, byDay, byHour, byDow, heat, dev, inApp, refs, matches, Q,
    pages: evs.filter(e => e.k === 'page').length,
    opens: evs.filter(e => e.k === 'page' && e.p.startsWith('/partido/')).length,
    vers: evs.filter(e => e.k === 'ver').length,
    gols: evs.filter(e => e.k === 'gol').length,
  };
}

// ---- pintar ----
function cols(values, labels, opt = {}){
  const max = Math.max(1, ...values); const top = values.indexOf(Math.max(...values));
  return '<div class="cols">' + values.map((v, i) => `<div class="col${v && i === top ? ' top' : ''}" title="${esc(labels[i])}: ${v}"><i style="height:${v / max * 100}%"></i>${opt.nums && v ? `<em>${v}</em>` : ''}</div>`).join('') + '</div>'
    + '<div class="labels">' + labels.map((l, i) => `<span>${opt.every && i % opt.every ? '' : esc(l)}</span>`).join('') + '</div>';
}
function rows(list){
  const max = Math.max(1, ...list.map(x => x[1]));
  return '<div class="rows">' + list.map(([n, v, extra]) => `<div class="row"><div class="nm"><span>${esc(n)}</span><span>${extra ?? v}</span></div><div class="bar"><i style="width:${v / max * 100}%"></i></div></div>`).join('') + '</div>';
}
const mName = m => { const j = (m.slug.match(/^j(\d+)-/) || [])[1]; const t = m.title.replace(/\b(PB\s+)?Anguera\b/i, '').replace(/\bvs\.?(?=\s|$)/i, '').replace(/\s+/g, ' ').trim(); return (j ? 'J' + j + ' · ' : '') + (t || m.title); };
const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '–';

function render(){
  const A = analyse(EVENTS);
  const n = A.S.length;
  // días del periodo (rellenando huecos)
  const days = []; const span = RANGE || Math.max(1, Math.ceil((Date.now() - (+A.evs[0]?.ts || Date.now())) / 864e5) + 1);
  for (let i = Math.min(span, 120) - 1; i >= 0; i--) days.push(parts(new Date(Date.now() - i * 864e5)).day);
  const dayVals = days.map(d => A.byDay.get(d) || 0);
  const hmax = Math.max(1, ...A.heat.flat());
  const bestH = A.byHour.indexOf(Math.max(...A.byHour)), bestD = A.byDow.indexOf(Math.max(...A.byDow));
  const qMax = A.Q.findLastIndex(v => v > 0);
  const qs = A.Q.slice(0, Math.max(4, qMax + 1));

  app.innerHTML = `
  ${DEMO ? '<div class="banner"><b>Datos de ejemplo.</b> Falta pegar la configuración de Firebase en <code>firebase-config.js</code>; cuando esté, aquí saldrán las visitas reales.</div>' : ''}
  <div class="ranges">${[[7,'7 días'],[30,'30 días'],[90,'90 días'],[0,'Todo']].map(([v, l]) => `<button data-r="${v}" class="${v === RANGE ? 'on' : ''}">${l}</button>`).join('')}</div>
  <div class="kpis">
    <div class="kpi"><b>${n}</b><span>Visitas (sesiones)</span></div>
    <div class="kpi"><b>${A.opens}</b><span>Partidos abiertos</span></div>
    <div class="kpi"><b>${A.vers}</b><span>Cuartos reproducidos</span></div>
    <div class="kpi"><b>${A.gols}</b><span>Saltos a un gol</span></div>
    <div class="kpi"><b>${pct(A.S.filter(s => s.evs.some(e => e.k === 'ver')).length, n)}</b><span>Visitas que ven vídeo</span></div>
    <div class="kpi"><b>${pct(A.inApp, n)}</b><span>Desde la app instalada</span></div>
  </div>
  ${!n ? '<div class="card"><div class="empty">Todavía no hay visitas en este periodo.</div></div>' : `
  <div class="grid">
    <div class="card wide"><h2>Visitas por día</h2><div class="sub">Sesiones que empiezan cada día</div>${cols(dayVals, days.map(dayLabel), { every: Math.ceil(days.length / 6) })}</div>
    <div class="card"><h2>Horas</h2><div class="sub">Hora punta: <b>${bestH}:00–${bestH + 1}:00</b></div>${cols(A.byHour, A.byHour.map((_, i) => String(i)), { every: 3 })}</div>
    <div class="card"><h2>Días de la semana</h2><div class="sub">Día con más visitas: <b>${['lunes','martes','miércoles','jueves','viernes','sábado','domingo'][bestD]}</b></div>${cols(A.byDow, DOW, { nums: true })}</div>
    <div class="card wide"><h2>Día y hora</h2><div class="sub">Cuanto más intenso, más visitas</div>
      <div class="heat"><span class="lb"></span>${Array.from({ length: 24 }, (_, h) => `<span class="hh">${h % 3 ? '' : h}</span>`).join('')}
      ${A.heat.map((r, d) => `<span class="lb">${DOW[d]}</span>` + r.map((v, h) => `<div title="${DOW[d]} ${h}:00 · ${v}" style="${v ? `background:rgba(47,69,214,${.18 + .82 * v / hmax})` : ''}"></div>`).join('')).join('')}</div></div>
    <div class="card wide"><h2>Partidos más vistos</h2><div class="sub">Visitas distintas que abren o ven cada partido, y cuántas veces se reproduce cada cuarto</div>
      <div class="tw"><table><thead><tr><th>Partido</th><th>Visitas</th><th class="hide-s">Aperturas</th><th>Cuartos</th><th>Q1–Q4</th><th>Goles</th></tr></thead><tbody>
      ${A.matches.map(m => { const qm = Math.max(1, ...m.q); return `<tr><td title="${esc(m.title)}">${esc(mName(m))}</td><td>${m.ses.size}</td><td class="hide-s">${m.open}</td><td>${m.ver}</td><td><span class="q">${m.q.slice(0, 4).map(v => `<i title="${v}" style="opacity:${.15 + .85 * v / qm}"></i>`).join('')}</span></td><td>${m.gol || ''}</td></tr>`; }).join('') || '<tr><td colspan="6" class="empty" style="max-width:none">Aún no se ha abierto ningún partido</td></tr>'}
      </tbody></table></div></div>
    <div class="card"><h2>Hasta dónde se ve</h2><div class="sub">Reproducciones de cada cuarto, todos los partidos</div>${rows(qs.map((v, i) => ['Cuarto ' + (i + 1), v, v + (i ? ' · ' + pct(v, qs[0]) + ' del Q1' : '')]))}</div>
    <div class="card"><h2>Dispositivo y origen</h2><div class="sub">Desde dónde entran</div>
      ${rows([['Móvil', A.dev.m || 0, (A.dev.m || 0) + ' · ' + pct(A.dev.m || 0, n)], ['Tablet', A.dev.t || 0, (A.dev.t || 0) + ' · ' + pct(A.dev.t || 0, n)], ['Ordenador', A.dev.d || 0, (A.dev.d || 0) + ' · ' + pct(A.dev.d || 0, n)]].filter(x => x[1]))}
      <div style="height:14px"></div>
      ${rows([...A.refs].sort((a, b) => b[1] - a[1]).slice(0, 6).map(([r, v]) => [r.replace(/^www\./, '').replace('web.whatsapp.com', 'WhatsApp'), v]))}</div>
    <div class="card wide"><h2>Última actividad</h2><div class="sub">Lo último que se ha hecho en la web</div>
      <div class="feed">${A.evs.slice(-40).reverse().map(e => `<div><time>${timeLabel(e.ts)}</time><span>${e.k === 'ver' ? '▶ ' : e.k === 'gol' ? '⚽ ' : ''}${esc(e.n)}${e.dv === 'd' ? ' · 💻' : ''}</span></div>`).join('')}</div></div>
  </div>`}
  <div class="foot"><span>Sin cookies ni datos personales: cada visita es un número aleatorio que desaparece al cerrar la pestaña.</span><div class="sp"></div>
    <button class="btn ghost" id="notrack"></button>${DEMO ? '' : '<button class="btn ghost" id="reload">Actualizar</button>'}</div>`;
  app.querySelectorAll('[data-r]').forEach(b => b.onclick = async () => { RANGE = +b.dataset.r; if (!DEMO) await fetchEvents(); render(); });
  const nt = $('#notrack'); const set = () => nt.textContent = localStorage.getItem('atv_notrack') === '1' ? '✓ No se cuentan mis visitas en este dispositivo' : 'No contar mis visitas en este dispositivo';
  set(); nt.onclick = () => { localStorage.setItem('atv_notrack', localStorage.getItem('atv_notrack') === '1' ? '0' : '1'); set(); };
  const rl = $('#reload'); if (rl) rl.onclick = async () => { await fetchEvents(); render(); };
}

// ---- Firebase ----
async function fetchEvents(){
  const { collection, query, where, orderBy, getDocs, Timestamp } = fs.mod;
  const since = RANGE ? new Date(Date.now() - RANGE * 864e5) : new Date(2020, 0, 1);
  app.style.opacity = .5;
  try {
    const snap = await getDocs(query(collection(fs.db, 'ev'), where('ts', '>=', Timestamp.fromDate(since)), orderBy('ts')));
    EVENTS = snap.docs.map(d => { const x = d.data(); return { ...x, ts: x.ts.toDate() }; });
  } finally { app.style.opacity = 1; }
}

async function start(){
  if (!FB.apiKey || !FB.projectId){ DEMO = true; EVENTS = sample(); render(); return; }
  const V = '10.12.2';
  const [{ initializeApp }, A, F] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
  ]);
  const fbApp = initializeApp(FB);
  const auth = A.getAuth(fbApp);
  fs = { db: F.getFirestore(fbApp), mod: F };
  $('#out').onclick = () => A.signOut(auth);
  A.onAuthStateChanged(auth, async user => {
    $('#out').hidden = !user;
    if (!user){
      app.innerHTML = `<div class="center"><div><p>Panel privado de estadísticas de Anguera TV.</p><button class="btn" id="login">Entrar con Google</button></div></div>`;
      $('#login').onclick = async () => {
        const prov = new A.GoogleAuthProvider();
        try { await A.signInWithPopup(auth, prov); }
        catch (e) { if (/popup/.test(e.code || '')) await A.signInWithRedirect(auth, prov); else alertBox(e.message); }
      };
      return;
    }
    if ((user.email || '').toLowerCase() !== ADMIN){
      app.innerHTML = `<div class="center"><div><p>La cuenta <b>${esc(user.email)}</b> no tiene acceso a este panel.</p><button class="btn ghost" id="o2">Usar otra cuenta</button></div></div>`;
      $('#o2').onclick = () => A.signOut(auth); return;
    }
    // Al entrar como admin, este dispositivo deja de contar en las estadísticas.
    if (localStorage.getItem('atv_notrack') === null) localStorage.setItem('atv_notrack', '1');
    try { await fetchEvents(); render(); }
    catch (e) { app.innerHTML = `<div class="center"><p>No se han podido leer los datos: ${esc(e.message)}</p></div>`; }
  });
}
function alertBox(msg){ const d = document.createElement('div'); d.className = 'banner'; d.textContent = msg; app.prepend(d); }
start();
</script>
</body>
</html>

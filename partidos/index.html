<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>PB Anguera TV</title>
<meta name="theme-color" content="#07090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anguera TV">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* PB Anguera TV — colores del escudo: amarillo (acción), azul, rojo (avisos) sobre negro de noche de partido. */
:root{--bg:#07090c;--s1:#12161c;--s2:#1b2028;--line:rgba(255,255,255,.09);--ink:#f4f5f7;--mute:#a7b0bc;--acc:#2F45D6;--accInk:#ffffff;--accT:#9DAEFF;--hi:#FFD21F;--red:#E0283E;--blue:#2337B8}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accT);outline-offset:2px}
.cond{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.01em}
main{padding-bottom:calc(110px + env(safe-area-inset-bottom))}

/* Barra superior */
.top{position:fixed;inset:0 0 auto;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) max(4vw,14px) 10px;background:linear-gradient(#07090cee,#07090c00);transition:background .2s}
.top.solid{background:#07090cf2;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer}
.brand img{width:34px;height:35px;border-radius:6px}
.brand span{font:900 22px/1 'Barlow Condensed',sans-serif;letter-spacing:.02em}
.brand b{color:var(--hi)}
.demotag{display:none;font:700 11px system-ui;color:#141100;background:#a7b0bc;border-radius:5px;padding:3px 6px}
body.demo .demotag{display:inline-block}
.sp{flex:1}
.icon{width:44px;height:44px;border-radius:22px;border:0;background:#ffffff14;display:grid;place-items:center;cursor:pointer;flex:none}

/* Escudos y equipos */
.crest{display:block;border-radius:18%;box-shadow:0 6px 18px #0009;object-fit:cover}
.kit{border-radius:50%;border:3px solid #fff;display:grid;place-items:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;flex:none;position:relative;overflow:hidden}
.kit img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:12%}
/* Ficha FCF */
.next{margin:0 max(4vw,18px);border-radius:18px;background:linear-gradient(110deg,#1E2F9E 0%,#12161c 60%);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px}
.next .when{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.next .when b{font:900 26px/1 'Barlow Condensed',sans-serif;text-transform:uppercase}
.next .when span{color:var(--hi);font-weight:800}
.next .row2{display:flex;align-items:center;gap:12px}
.next .row2 .nm{font-weight:700;font-size:17px;line-height:1.2}
.next .where{color:var(--mute);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding:0 max(4vw,18px)}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.stat b{display:block;font:900 24px/1 'Barlow Condensed',sans-serif}
.stat span{font-size:11px;color:var(--mute);font-weight:700}
.stat.v b{color:#4ADE80}.stat.d b{color:#FB7185}
.scorers{display:flex;gap:8px;overflow-x:auto;padding:12px max(4vw,18px) 2px;scrollbar-width:none}
.scorer{flex:none;display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:6px 12px 6px 6px;font-weight:700;font-size:14px;white-space:nowrap}
.scorer .n{width:30px;height:30px;border-radius:15px;background:var(--acc);color:var(--accInk);display:grid;place-items:center;font:900 15px 'Barlow Condensed',sans-serif}
.scorer i{font-style:normal;color:var(--mute);font-weight:600}
.ficha{margin:0 max(4vw,18px);background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.finfo{display:flex;flex-wrap:wrap;gap:6px 14px;padding:14px 16px;color:var(--mute);font-size:14px;border-bottom:1px solid var(--line)}
.finfo b{color:var(--ink)}
.res{font:800 12px/1 Barlow,sans-serif;padding:5px 8px;border-radius:6px;color:#fff;letter-spacing:.03em}
.goal{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.goal .m{width:36px;font:900 18px 'Barlow Condensed',sans-serif;color:var(--hi);font-variant-numeric:tabular-nums}
.goal .w{flex:1;font-weight:700}
.goal .w i{font-style:normal;color:var(--mute);font-weight:600}
.goal .s{font:800 15px 'Barlow Condensed',sans-serif;color:var(--mute);white-space:nowrap}
.goal.riv{opacity:.55}
button.goal{font:inherit;color:inherit;background:none;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;cursor:pointer}
button.goal:active{background:#ffffff0f}
.goal .go{width:30px;height:30px;border-radius:15px;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
.goal.riv .m{color:var(--mute)}
.cell.novid{opacity:.6;cursor:default}
.cell.pend{background:transparent;border-style:dashed;cursor:default}
.cell em{font-style:normal;font:800 13px/1 'Barlow Condensed',sans-serif;margin-top:3px}
.team{display:flex;flex-direction:column;align-items:center;gap:8px;width:110px;text-align:center}
.team .nm{font:800 20px/1.05 'Barlow Condensed',sans-serif;text-transform:uppercase;text-wrap:balance}
.vsrow{display:flex;align-items:center;justify-content:center;gap:6px}
.vsx{font:900 40px/1 'Barlow Condensed',sans-serif;flex:1;text-align:center;white-space:nowrap}
.vsx.sc{color:#fff}

/* Portada */
.hero{position:relative;height:min(78vh,600px);min-height:500px;overflow:hidden;background:#13201a}
.hero .bg{position:absolute;inset:0;background:radial-gradient(60% 45% at 78% 8%,#fff3c455,transparent 60%),linear-gradient(180deg,#1b2a1e,#2f6b3a 45%,#1c4426)}
.hero .bg img{width:100%;height:100%;object-fit:cover;animation:kb 14s ease-in-out infinite alternate;transform-origin:60% 40%}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#07090c 5%,#07090cd9 38%,#07090c33 75%,#07090c99)}
.hero .in{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:0 max(5vw,18px) 24px;display:flex;flex-direction:column;gap:14px;max-width:620px;margin:0 auto}
.tag{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:13px;color:var(--hi);letter-spacing:.02em}
.tag i{width:8px;height:8px;border-radius:4px;background:var(--red);box-shadow:0 0 0 4px #E0283E33}
.meta{text-align:center;color:var(--mute);font-size:14px}
.btn{height:50px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:var(--s1);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--acc);color:var(--accInk);border-color:var(--acc);font-weight:800;font-size:17px}
.dots{display:flex;justify-content:center;gap:6px}
.dots button{width:8px;height:8px;padding:0;border:0;border-radius:4px;background:#ffffff55;cursor:pointer;transition:width .25s}
.dots button.on{width:24px;background:#fff}

/* Secciones y carriles */
.sec{margin-top:26px}
.shead{display:flex;align-items:baseline;gap:10px;padding:0 max(4vw,18px);margin-bottom:12px}
.shead h2{font:800 22px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:0;flex:1}
.shead .lnk{background:none;border:0;color:var(--mute);font-weight:600;font-size:14px;cursor:pointer;padding:6px 0}
.row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px max(4vw,18px) 8px;scroll-padding-inline:max(4vw,18px);scrollbar-width:none}
.row::-webkit-scrollbar{display:none}

/* Tarjeta tipo marcador */
.card{all:unset;flex:0 0 clamp(240px,70vw,290px);scroll-snap-align:start;cursor:pointer;border-radius:16px;overflow:hidden;background:var(--s1);border:1px solid var(--line);display:block;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card:focus-visible{outline:2px solid var(--accT);outline-offset:2px}
.thumb{position:relative;aspect-ratio:16/8;background:linear-gradient(165deg,#2a3d2b,#2f6b3a 55%,#204d2a);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:10px;top:10px;background:#07090c;font:800 15px/1 'Barlow Condensed',sans-serif;padding:6px 8px;border-radius:7px;white-space:nowrap}
.badge.new{background:var(--red)}
.dur{position:absolute;right:10px;bottom:10px;background:#000000b3;font-size:12px;font-weight:600;padding:3px 7px;border-radius:6px;white-space:nowrap}
.seen{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--accT)}
.mini{display:flex;align-items:center;gap:8px;padding:12px 12px 4px}
.mini .vs{flex:1;text-align:center;font:800 16px 'Barlow Condensed',sans-serif;color:var(--mute);white-space:nowrap}
.mini .vs.sc{color:#fff;font-size:20px}
.ctitle{padding:0 12px 14px;font-weight:600;font-size:15px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Cuadrícula de temporada */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 max(4vw,18px)}
@media(min-width:700px){.grid{grid-template-columns:repeat(8,minmax(0,1fr))}}
.cell{all:unset;cursor:pointer;height:64px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--s1);border:1px solid var(--line);text-align:center}
.cell:focus-visible{outline:2px solid var(--accT)}
.cell b{font:900 20px/1 'Barlow Condensed',sans-serif}
.cell span{font-size:11px;font-weight:600;color:var(--mute);max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.last{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.cell.last span{color:#dbe2ff}
.cell.seen{box-shadow:inset 0 -3px 0 var(--accT)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 max(4vw,18px) 4px;scrollbar-width:none}
.chip{flex:none;height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Página del partido */
.mhead{position:relative;overflow:hidden;padding:calc(env(safe-area-inset-top) + 72px) max(5vw,18px) 22px}
.mhead .bg{position:absolute;inset:-30px;background:linear-gradient(180deg,#24402a,#2f6b3a 60%,#1c3a22)}
.mhead .bg img{width:100%;height:100%;object-fit:cover;filter:blur(18px) saturate(1.2)}
.mhead::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#07090c 0%,#07090cbf 55%,#07090c80)}
.mhead .in{position:relative;z-index:1;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.stage{width:100%;max-width:1100px;margin:0 auto;aspect-ratio:16/9;background:#000;position:relative}
.vid{position:absolute;inset:0;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;transform-origin:0 0}
.zpad{position:absolute;inset:0;display:none;touch-action:none;cursor:grab;z-index:2}
.zoomon .zpad,.native .zpad{display:block}
.vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:0 0;display:none;background:#000}
.native video{display:block}.native iframe{display:none}
/* Controles del reproductor propio */
.ctl{position:absolute;inset:0;z-index:4;display:none;flex-direction:column;pointer-events:none;opacity:0;transition:opacity .25s}
.ctl::before{content:"";position:absolute;inset:0;background:linear-gradient(#000a 0%,#0000 28%,#0000 55%,#000c 100%);z-index:-1}
.native .ctl{display:flex}
.ctl.on{opacity:1}
.ctl.on button,.ctl.on .bar{pointer-events:auto}
.native .fsbar{display:none!important}
.isnative .fsrow{display:none}
.ctop{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--sat,0px)) 12px 0}
.stage:fullscreen .ctop,.stage:-webkit-full-screen .ctop,.stage.pfs .ctop{--sat:env(safe-area-inset-top)}
.stage:fullscreen .cbot,.stage.pfs .cbot{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.qpill{background:var(--acc);color:var(--accInk);font:900 15px/1 'Barlow Condensed',sans-serif;padding:5px 8px;border-radius:6px;flex:none}
.ctop .ttl{font-weight:700;font-size:14px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 3px #000}
.ib{width:40px;height:40px;border-radius:20px;border:0;background:#ffffff1f;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;padding:0;font:800 13px Barlow,sans-serif}
.ib:disabled{opacity:.3}
.ib.on{background:var(--acc);color:var(--accInk)}
.cmid{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(28px,10vw,80px)}
.cb{width:52px;height:52px;border-radius:50%;border:0;background:#0000008c;color:#fff;display:grid;place-items:center;cursor:pointer;position:relative;padding:0;backdrop-filter:blur(4px)}
.cb.big{width:68px;height:68px;background:#ffffffeb;color:#07090c}
.cb small{position:absolute;inset:0;display:grid;place-items:center;font:800 9px Barlow,sans-serif;padding-top:2px}
.cbot{padding:0 12px 8px}
.bar{position:relative;height:26px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.bar .tr{position:absolute;left:0;right:0;height:4px;border-radius:2px;background:#ffffff40;overflow:hidden;transition:height .15s}
.bar:hover .tr,.bar.drag .tr{height:7px}
.bar .bf{position:absolute;left:0;top:0;bottom:0;background:#ffffff59}
.bar .pl{position:absolute;left:0;top:0;bottom:0;background:var(--accT)}
.bar .th{position:absolute;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px #2f45d666;transition:transform .15s}
.bar.drag .th{transform:scale(1.25)}
.bar .bub{position:absolute;bottom:26px;transform:translateX(-50%);background:#fff;color:#07090c;font:800 13px Barlow,sans-serif;padding:3px 8px;border-radius:6px;display:none;white-space:nowrap}
.bar.drag .bub{display:block}
.crow{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.crow .tm{flex:1;text-shadow:0 1px 3px #000}
.crow .tm span{color:#ffffffa6}
.spd{width:auto;min-width:44px;padding:0 10px}
.ripple{position:absolute;top:0;bottom:0;width:40%;z-index:3;display:grid;place-items:center;color:#fff;font:800 17px Barlow,sans-serif;opacity:0;transition:opacity .4s;pointer-events:none;text-shadow:0 1px 4px #000}
.ripple.l{left:0;border-radius:0 50% 50% 0/0 100% 100% 0;background:linear-gradient(90deg,#ffffff2a,#ffffff10)}
.ripple.r{right:0;border-radius:50% 0 0 50%/100% 0 0 100%;background:linear-gradient(270deg,#ffffff2a,#ffffff10)}
.ripple.on{opacity:1;transition:none}
.resume{position:absolute;left:12px;bottom:64px;z-index:5;display:none;align-items:center;gap:8px;background:#000d;color:#fff;font-size:13px;font-weight:600;padding:6px 6px 6px 12px;border-radius:20px}
.resume.on{display:flex}
.resume button{height:30px;border-radius:15px;border:0;background:#ffffff26;color:#fff;font:700 13px Barlow,sans-serif;padding:0 10px;cursor:pointer}
.spin{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;border:4px solid #ffffff33;border-top-color:var(--accT);animation:sp 1s linear infinite;z-index:3;display:none}
.native.loading .spin{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.zoomon .vid{box-shadow:inset 0 0 0 3px var(--accT)}
.zhint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#000c;color:#fff;font-size:13px;font-weight:600;padding:6px 12px;border-radius:16px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .3s;z-index:3}
.zhint.on{opacity:1}
.fsb.on{background:var(--acc);color:var(--accInk)}
.wbody{max-width:1100px;margin:0 auto;padding:16px max(4vw,18px) 0;display:flex;flex-direction:column;gap:12px}
.qtabs{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:8px}
.qtab{height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--s1);font:900 20px 'Barlow Condensed',sans-serif;cursor:pointer}
.qtab.on{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.two{display:flex;gap:8px}
.two .btn{flex:1;height:46px;font-weight:600;font-size:15px}
.fsrow{display:flex;gap:8px}.fsrow .pri{flex:1}.fsrow .zbtn{flex:none;width:auto;padding:0 16px;height:50px}
.zbtn.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}

/* Pantalla completa (real o simulada en iPhone): controles en columna, nunca encima del vídeo */
.stage:fullscreen{max-width:none;width:100vw;height:100vh;aspect-ratio:auto;display:flex}
.stage:-webkit-full-screen{max-width:none;width:100vw;height:100vh;aspect-ratio:auto;display:flex}
.stage.pfs{position:fixed;inset:0;z-index:60;max-width:none;width:100vw;height:100vh;height:100dvh;aspect-ratio:auto;display:flex}
.stage:fullscreen .vid,.stage:-webkit-full-screen .vid,.stage.pfs .vid{position:relative;inset:auto;flex:1;min-width:0;height:100%}
.fsbar{display:none;flex:none;align-items:center;justify-content:center;gap:10px;background:#000;padding:calc(env(safe-area-inset-top) + 8px) 8px 8px calc(env(safe-area-inset-left) + 8px)}
.stage:fullscreen .fsbar,.stage:-webkit-full-screen .fsbar,.stage.pfs .fsbar{display:flex;flex-direction:column;width:calc(env(safe-area-inset-left) + 64px)}
.fsb{width:48px;height:48px;border-radius:50%;border:0;background:#1b2028;color:#fff;font:800 16px 'Barlow Condensed',sans-serif;display:grid;place-items:center;cursor:pointer;padding:0}
#fsName{background:transparent;color:var(--hi);font-size:18px;height:auto}
.fsb[hidden]{display:none}
.fsb:disabled{opacity:.25;cursor:default}
@media (orientation:portrait){
  .stage:fullscreen,.stage:-webkit-full-screen,.stage.pfs{flex-direction:column}
  .stage:fullscreen .fsbar,.stage:-webkit-full-screen .fsbar,.stage.pfs .fsbar{flex-direction:row;width:auto;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
}

/* Menú inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#0d1015f2;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;height:64px;border:0;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;cursor:pointer}
.tabs button.on{color:var(--accT);font-weight:700}

/* Buscar */
.search{position:fixed;inset:0;z-index:40;background:#07090cf7;display:none;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 0 100px}
.search.open{display:block}
.sbar{display:flex;gap:10px;padding:0 max(4vw,18px);margin-bottom:18px}
.sbar input{flex:1;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--s1);padding:0 16px;font-size:17px}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px;padding:0 max(4vw,18px)}
.results .card{flex:none}

/* Carga */
.skel{background:linear-gradient(90deg,#12161c,#1b2028,#12161c);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:16px}
@keyframes sk{to{background-position:-200% 0}}
.center{min-height:70vh;display:grid;place-items:center;text-align:center;padding:100px 20px;color:var(--mute)}
.splash{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:var(--bg);transition:opacity .4s}
.splash.off{opacity:0;pointer-events:none}
.splash img{width:110px;border-radius:18px;animation:pl 1.4s ease-in-out infinite}
@keyframes pl{50%{transform:scale(.93);opacity:.75}}
.view{animation:fi .25s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(6px)}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:90}
.toast.on{opacity:1}

/* Aviso de instalación */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#151a21;border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px #000a;transform:translateY(110%);transition:transform .35s}
.sheet.on{transform:none}
.sheet h2{margin:0 0 6px;font-size:20px}
.sheet p{margin:0 0 12px;color:var(--mute);font-size:15px}
.sheet ol{margin:0 0 16px;padding-left:20px}
.sheet li{margin:6px 0}

/* ===== Noche de partido ===== */
.hero{height:min(86vh,660px);min-height:560px;background:radial-gradient(120% 70% at 50% 100%,#1f5a30 0%,#0d2a1a 45%,#060816 78%)}
.hero .bg img{opacity:.55}
.beam{position:absolute;top:-60px;width:56%;height:78%;filter:blur(8px);pointer-events:none;z-index:1;animation:beam 6s ease-in-out infinite alternate}
.beam.l{left:-16%;background:linear-gradient(160deg,#fff7d640,#fff7d600 70%);transform:rotate(-16deg);transform-origin:top left}
.beam.r{right:-16%;background:linear-gradient(200deg,#fff7d640,#fff7d600 70%);transform:rotate(16deg);transform-origin:top right;animation-delay:-3s}
@keyframes beam{to{opacity:.55}}
.flood{position:absolute;top:calc(env(safe-area-inset-top) + 74px);width:9px;height:9px;border-radius:5px;background:#fff;box-shadow:0 0 30px 14px #fff3c4aa;z-index:1}
.flood.l{left:18px}.flood.r{right:18px}
.wm{position:absolute;right:-90px;top:110px;width:330px;opacity:.07;transform:rotate(-10deg);z-index:1;pointer-events:none}
.hero .in{gap:12px}
.hero .in>*{animation:up .6s cubic-bezier(.2,.8,.2,1) both}
.hero .in>*:nth-child(2){animation-delay:.06s}.hero .in>*:nth-child(3){animation-delay:.12s}.hero .in>*:nth-child(4){animation-delay:.18s}.hero .in>*:nth-child(5){animation-delay:.24s}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.bug{align-self:center;display:flex;border-radius:9px;overflow:hidden;box-shadow:0 10px 26px #000a;font:800 15px/1 'Barlow Condensed',sans-serif;white-space:nowrap}
.bug span{padding:7px 10px;color:#fff}
.bug .j{background:var(--red)}.bug .d{background:#0d1030}
.duel{position:relative;height:150px;margin-bottom:6px}
.duel .band{position:absolute;left:-24px;right:-24px;top:50px;height:70px;transform:skewY(-4deg);opacity:.95}
.duel .band.st{background:repeating-linear-gradient(100deg,#0000 0 10px,#00000022 10px 12px)}
.duel .side{position:absolute;top:0;width:32%;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.duel .side.l{left:0}.duel .side.r{right:0}
.duel .side b{font:900 22px/1.05 'Barlow Condensed',sans-serif;text-transform:uppercase;text-shadow:0 2px 10px #000;text-wrap:balance}
.duel .crest,.duel .kit{box-shadow:0 16px 32px #000c}
.duel .mid{position:absolute;left:50%;top:46px;transform:translateX(-50%);font:italic 900 60px/1 'Barlow Condensed',sans-serif;text-shadow:0 4px 20px #000;white-space:nowrap;z-index:1}
.duel .mid.sc{font-size:clamp(40px,12vw,56px);letter-spacing:-.02em}
.duel .mid{top:56px}
.merlons{height:12px;margin-top:30px;background:repeating-linear-gradient(90deg,var(--red) 0 22px,transparent 22px 34px)}
.tint{position:absolute;inset:0;opacity:.5;mix-blend-mode:hard-light}
.jbig{position:absolute;left:12px;bottom:2px;font:900 76px/.8 'Barlow Condensed',sans-serif;color:transparent;-webkit-text-stroke:2px #ffffffd9;pointer-events:none}
.card .thumb{aspect-ratio:16/9}
.road{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;padding:8px max(4vw,18px) 4px;scroll-snap-type:x proximity}
.road::-webkit-scrollbar{display:none}
.stop{all:unset;flex:none;width:60px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;scroll-snap-align:center;cursor:default}
.stop[data-id]{cursor:pointer}
.stop::before{content:"";position:absolute;top:18px;left:0;right:0;height:3px;background:var(--line);z-index:0}
.stop.done::before{background:var(--acc)}
.stop:first-child::before{left:50%}.stop:last-child::before{right:50%}
.stop .dot{position:relative;z-index:1;width:38px;height:38px;border-radius:19px;display:grid;place-items:center;font:900 14px/1 'Barlow Condensed',sans-serif;background:#060816;border:2px dashed #ffffff40;color:var(--mute)}
.stop.done .dot{background:var(--acc);border:2px solid var(--acc);color:#fff}
.stop.now .dot{background:#fff;border-color:#fff;color:#07090c;box-shadow:0 0 0 5px #ffffff26,0 0 22px #9daeffaa}
.stop.next .dot{border:2px solid var(--hi);color:var(--hi)}
.stop.novid .dot{opacity:.65}
.stop small{font-size:11px;font-weight:700;color:var(--mute);white-space:nowrap}
.stop em{font:800 13px/1 'Barlow Condensed',sans-serif;font-style:normal;white-space:nowrap}
.mhead{padding-bottom:26px}
.mhead .split{position:absolute;inset:0;opacity:.85}
.mhead .bg{opacity:.35}
.mhead .wm{top:60px;left:-80px;right:auto;width:260px;opacity:.12}
.qseg{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:6px}
.qs{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:7px}
.qs:focus-visible{outline:2px solid var(--accT);outline-offset:4px;border-radius:6px}
.qs .tr{height:8px;border-radius:4px;background:#ffffff1f;overflow:hidden}
.qs .tr i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.qs b{font:900 20px/1 'Barlow Condensed',sans-serif}
.qs span{font-size:12px;color:var(--mute);font-weight:600}
.qs.on b{color:var(--accT)}.qs.on .tr i{background:var(--accT)}
.tabs{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));border-radius:24px;border:1px solid #ffffff1f;background:#0d1030f2;box-shadow:0 14px 30px #000a;padding-bottom:0;align-items:center;overflow:visible}
.tabs .home{flex:none;width:66px;height:66px;margin-top:-34px;border-radius:21px;background:var(--acc);box-shadow:0 10px 26px #2f45d677;display:grid;place-items:center;border:3px solid #060816}
.tabs .home img{width:40px;border-radius:6px}

/* ===== WOW ===== */
.intro{display:flex;flex-direction:column;align-items:center;gap:18px;position:relative}
.intro .ring{position:absolute;top:56px;left:50%;width:10px;height:10px;margin:-5px;border-radius:50%;animation:ring 1.3s ease-out .2s both}
@keyframes ring{from{box-shadow:0 0 0 0 #2f45d6cc,0 0 0 0 #ffd21f88}to{box-shadow:0 0 0 170px #2f45d600,0 0 0 280px #ffd21f00}}
.splash img{position:relative;animation:crestIn .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes crestIn{from{transform:scale(.2) rotate(-25deg);opacity:0}}
.intro .wd{font:900 34px/1 'Barlow Condensed',sans-serif;letter-spacing:.04em;overflow:hidden}
.intro .wd span{display:inline-block;animation:up .5s .45s both}
.intro .wd b{color:var(--hi)}
.intro .ln{width:0;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--red),var(--hi),var(--acc));animation:ln .6s .6s both}
@keyframes ln{to{width:180px}}
.fx{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.duel .side.l{animation:inL .7s cubic-bezier(.2,.9,.2,1) both}
.duel .side.r{animation:inR .7s cubic-bezier(.2,.9,.2,1) both}
@keyframes inL{from{transform:translateX(-90px);opacity:0}}
@keyframes inR{from{transform:translateX(90px);opacity:0}}
.duel .band{animation:wipe .6s .1s cubic-bezier(.2,.9,.2,1) both}
@keyframes wipe{from{transform:skewY(-4deg) scaleX(0)}to{transform:skewY(-4deg) scaleX(1)}}
.duel .mid{animation:pop .5s .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:translateX(-50%) scale(.2);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.btn.pri{position:relative;overflow:hidden}
.btn.pri::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,#ffffff55,transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.card:active{transform:scale(.97)}
.sec.rv{opacity:0;transform:translateY(28px);transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1)}
.sec.rv.in{opacity:1;transform:none}
.cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cd div{background:#00000059;border:1px solid var(--line);border-radius:12px;padding:8px 0;text-align:center}
.cd b{display:block;font:900 30px/1 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
.cd span{font-size:11px;font-weight:700;color:var(--mute)}
.next{animation:glow 2.6s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 0 #2f45d600}to{box-shadow:0 0 34px 0 #2f45d680}}
.streak{margin:0 max(4vw,18px) 12px;padding:16px;border-radius:18px;background:linear-gradient(110deg,#16A34A40,#12161c 70%);border:1px solid #16a34a66;display:flex;flex-direction:column;gap:10px}
.streak h3{margin:0;font:italic 900 30px/1 'Barlow Condensed',sans-serif;text-transform:uppercase}
.streak h3 em{color:#4ADE80}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:900 15px 'Barlow Condensed',sans-serif;color:#fff}
.sec.in .pill,.sec:not(.rv) .pill{animation:pop2 .4s both}
@keyframes pop2{from{transform:scale(0)}}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end;padding:14px max(4vw,18px) 0}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pod .n{width:44px;height:44px;border-radius:22px;background:var(--acc);color:#fff;display:grid;place-items:center;font:900 20px 'Barlow Condensed',sans-serif;border:2px solid #fff}
.pod .nm{font-weight:700}
.pod .st{width:100%;border-radius:12px 12px 0 0;background:linear-gradient(180deg,var(--acc),#12161c);display:flex;flex-direction:column;align-items:center;padding-top:10px;height:72px}
.pod .st b{font:900 34px/1 'Barlow Condensed',sans-serif}
.pod .st span{font-size:11px;font-weight:700;color:#dbe2ff}
.pod.p1 .st{height:124px;background:linear-gradient(180deg,#FFD21F,#7a5d00 150%)}
.pod.p1 .st b,.pod.p1 .st span{color:#14163a}
.pod.p1 .n{background:#FFD21F;color:#14163a;width:52px;height:52px;border-radius:26px;box-shadow:0 0 24px #ffd21f88}
.pod.p2 .st{height:94px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="splash" id="splash"><div class="intro"><span class="ring"></span><img src="icons/escudo.png" alt="PB Anguera"><div class="wd"><span>ANGUERA <b>TV</b></span></div><div class="ln"></div></div></div>

<header class="top" id="top">
  <button class="brand" id="home" aria-label="Inicio"><img src="icons/escudo.png" alt=""><span>ANGUERA <b>TV</b></span></button>
  <span class="demotag">DEMO</span>
  <div class="sp"></div>
  <button class="icon" id="openSearch" aria-label="Buscar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
</header>

<main id="app"></main>

<nav class="tabs" aria-label="Secciones">
  <button id="tHome" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg>Inicio</button>
  <button id="tLatest" class="home" aria-label="Último partido"><img src="icons/escudo.png" alt=""></button>
  <button id="tSeason"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>Temporada</button>
</nav>

<section class="search" id="search" role="dialog" aria-label="Buscar partidos">
  <div class="sbar"><input id="q" type="search" placeholder="Rival, jornada, temporada…" aria-label="Buscar"><button class="btn" id="closeSearch">Cerrar</button></div>
  <div class="results" id="results"></div>
</section>

<div class="toast" id="toast"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Instalar la app">
  <h2>Instala Anguera TV</h2>
  <p>Tendrás los partidos en la pantalla de inicio, como una app.</p>
  <ol id="steps"></ol>
  <div class="two"><button class="btn" id="later">Ahora no</button><button class="btn pri" id="install" hidden>Instalar</button></div>
</div>

<script>
{
const CREST = 'icons/escudo.png';
const APP_URL = location.origin + location.pathname;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} } };
const MONTHS = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
let DATA = [], DEMO = false, view = 'home', current = null, part = 0, startId = null, heroIdx = 0, heroTimer = null, seasonGroup = '';
let seen = (() => { try { return JSON.parse(store.get('partidos_seen') || '[]'); } catch (e) { return []; } })();

// ---- Utilidades ----
const fmtDate = ms => { if (!ms) return ''; const d = new Date(ms); return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); };
const thumb = (id, w) => 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + (w || 640);
const isNew = m => !!m.date && Date.now() - m.date < 8 * 864e5;
const partName = n => { const b = String(n).replace(/\.[^.]+$/, ''); const q = b.match(/^\s*(?:(\d)\s*(?:r|n|t|º)?\s*quart|q\s*(\d)(?!\d))/i); return q ? 'Quart ' + (q[1] || q[2]) : b.replace(/_/g, ' '); };
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const teams = t => { const p = String(t).split(/\s+(?:vs\.?|v|contra|-|–)\s+/i); return p.length === 2 ? p.map(x => x.trim()) : null; };
const isAng = n => /anguera|^pba?\b/.test(norm(n));
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 1800); }

// ---- Rivales: colores de su primera equipación (FCF, Prebenjamí S8 grup 3) ----
const KITS = [
  [/bufal/, 'BUF', 'linear-gradient(180deg,#E30613 60%,#111 60%)', '#fff', '#E30613'],
  [/badalona/, 'BAD', 'linear-gradient(160deg,#1530D6 42%,#fff 42% 56%,#1530D6 56%)', '#fff', '#1530D6'],
  [/sing(u)?erl/, 'SIN', 'repeating-linear-gradient(90deg,#22C55E 0 6px,#fff 6px 12px)', '#07360f', '#16A34A'],
  [/sistrells/, 'SIS', 'linear-gradient(180deg,#1530D6 72%,#FFE600 72%)', '#fff', '#1530D6'],
  [/lloreda/, 'LLO', 'linear-gradient(135deg,#E30613 40%,#fff 40% 55%,#E30613 55%)', '#fff', '#E30613'],
  [/stoitchkov|racing/, 'RAC', 'linear-gradient(180deg,#f2f2f2 60%,#8B1E1E 60%)', '#8B1E1E', '#8B1E1E'],
  [/grama|gramanet|gramenet/, 'GRA', 'linear-gradient(180deg,#1530D6 60%,#fff 60%)', '#fff', '#1530D6'],
  [/alzamora/, 'ALZ', 'repeating-linear-gradient(135deg,#E30613 0 8px,#fff 8px 12px)', '#fff', '#E30613']
];
const teamColor = n => { if (isAng(n)) return '#2F45D6'; const k = KITS.find(x => x[0].test(norm(n))); return k ? k[4] : '#4b5563'; };
const STOP = /\b(cf|c\.f|ue|u\.e|ud|fc|ce|c\.e|ef|ff|fe|club|esp|futbol|fundacio|esportiva|escola|de|del|la|el)\b/g;
const code = n => { const w = norm(n).replace(/[.,]/g, ' ').replace(STOP, ' ').trim().split(/\s+/)[0] || '?'; return w.slice(0, 3).toUpperCase(); };
const STOPW = new Set(['cf', 'c', 'f', 'ue', 'u', 'e', 'ud', 'fc', 'ce', 'ef', 'ff', 'fe', 'club', 'esp', 'futbol', 'fundacio', 'esportiva', 'escola', 'de', 'del', 'la', 'el']);
const shortName = n => { if (isAng(n)) return 'Anguera'; const w = String(n).split(/[\s.,]+/).filter(x => x && !STOPW.has(norm(x))); return w.join(' ').toLowerCase().replace(/(^|[\s-])\S/g, c => c.toUpperCase()) || String(n); };
const RES = { V: ['VICTORIA', '#16A34A'], E: ['EMPATE', '#6b7480'], D: ['DERROTA', '#E0283E'] };
let FCF = null, FCFJ = {};
const crestOf = (m, name) => { const a = m && m.fcf; if (!a || isAng(name)) return ''; return a.angueraHome ? a.awayCrest : a.homeCrest; };
function badge(name, size, crest){
  if (isAng(name)) return '<img class="crest" src="' + CREST + '" alt="PB Anguera" style="width:' + size + 'px;height:' + Math.round(size * 1.02) + 'px">';
  const k = KITS.find(x => x[0].test(norm(name)));
  const [c, bg, ink] = k ? [k[1], k[2], k[3]] : [code(name), '#3a414c', '#fff'];
  return '<div class="kit" role="img" aria-label="' + esc(name) + '" style="width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size * .33) + 'px;background:' + bg + ';color:' + ink + ';text-shadow:' + (ink === '#fff' ? '0 1px 3px #000' : 'none') + '">' + esc(c) +
    (/^https:\/\/files\.fcf\.cat\//.test(crest || '') ? '<img alt="" loading="lazy" src="' + esc(crest) + '" onerror="this.remove()">' : '') + '</div>';
}
const rival = m => { const t = teams(m.title); return t ? (isAng(t[0]) ? t[1] : t[0]) : ''; };
function matchup(m, size){
  const t = teams(m.title);
  if (!t) return '<div class="vsrow">' + badge('Anguera', size) + '</div><div class="team" style="width:auto"><div class="nm">' + esc(m.title) + '</div></div>';
  const mid = m.score ? '<div class="vsx sc">' + esc(m.score.replace('-', ' – ')) + '</div>' : '<div class="vsx">VS</div>';
  return '<div class="vsrow">' + t.map((n, i) => (i ? mid : '') + '<div class="team">' + badge(n, size, crestOf(m, n)) + '<div class="nm">' + esc(isAng(n) ? 'Anguera' : n) + '</div></div>').join('') + '</div>' +
    (m.res ? '<div style="display:flex;justify-content:center"><span class="res" style="background:' + RES[m.res][1] + '">' + RES[m.res][0] + '</span></div>' : '');
}

function duel(m, size){
  const t = teams(m.title);
  if (!t) return '<div class="duel" style="height:auto;display:flex;flex-direction:column;align-items:center;gap:12px">' + badge('Anguera', size) + '<div class="nm cond" style="font-weight:900;font-size:24px;text-align:center">' + esc(m.title) + '</div></div>';
  const [L, R] = t, cL = teamColor(L), cR = teamColor(R);
  return '<div class="duel"><div class="band" style="background:linear-gradient(100deg,' + cL + ' 0 47%,#060816 47% 53%,' + cR + ' 53% 100%)"></div><div class="band st"></div>' +
    '<div class="side l">' + badge(L, size, crestOf(m, L)) + '<b>' + esc(isAng(L) ? 'Anguera' : L) + '</b></div>' +
    '<div class="mid' + (m.score ? ' sc' : '') + '">' + esc(m.score ? m.score.replace('-', '–') : 'VS') + '</div>' +
    '<div class="side r">' + badge(R, size, crestOf(m, R)) + '<b>' + esc(isAng(R) ? 'Anguera' : R) + '</b></div></div>';
}
const resChip = m => m.res ? '<div style="display:flex;justify-content:center"><span class="res" style="background:' + RES[m.res][1] + '">' + RES[m.res][0] + '</span></div>' : '';
function bugHTML(m){
  const t = teams(m.title), d = m.date ? new Date(m.date) : null;
  return '<div class="bug">' + (m.jornada ? '<span class="j">J' + m.jornada + '</span>' : '') +
    (t ? '<span style="background:' + teamColor(t[0]) + '">' + esc(isAng(t[0]) ? 'ANG' : code(t[0])) + '</span>' : '') +
    '<span class="d">' + esc(d ? DIAS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] : (m.group || 'PARTIDO')) + '</span>' +
    (t ? '<span style="background:' + teamColor(t[1]) + '">' + esc(isAng(t[1]) ? 'ANG' : code(t[1])) + '</span>' : '') + '</div>';
}
// ---- El camino: la temporada como una línea de jornadas ----
function roadHTML(){
  if (!FCF) return '';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const lastPlayed = [...FCF.matches].filter(a => a.score).sort((x, y) => (y.date || '').localeCompare(x.date || ''))[0];
  const next = FCF.matches.find(a => !a.score && a.date && new Date(a.date + 'T23:59:00') >= today);
  const stops = FCF.matches.map(a => {
    const m = DATA.find(x => x.fcf === a), riv = a.angueraHome ? a.away : a.home;

  const m = /^(\d{1,2}):(\d{2})$/.exec(a.time || ''); if (!m || !a.date) return '';
  return '<div class="cd" id="cd" data-t="' + esc(a.date + 'T' + m[1].padStart(2, '0') + ':' + m[2] + ':00') + '">' + ['días', 'horas', 'min', 'seg'].map(l => '<div><b>--</b><span>' + l + '</span></div>').join('') + '</div>';
}
function startCD(){
  clearInterval(cdTimer); const el = $('#cd'); if (!el) return;
  const t = new Date(el.dataset.t).getTime(); if (isNaN(t)) { el.remove(); return; }
  const tick = () => { const c = $('#cd'); if (!c) return clearInterval(cdTimer); const s = Math.max(0, Math.floor((t - Date.now()) / 1000));
    const v = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60];
    c.querySelectorAll('b').forEach((b, i) => { b.textContent = i ? String(v[i]).padStart(2, '0') : v[i]; }); };
  tick(); cdTimer = setInterval(tick, 1000);
}
function streakHTML(played){
  const seq = [...played].sort((x, y) => (x.date || '').localeCompare(y.date || '')).map(a => { const f = a.angueraHome ? a.score[0] : a.score[1], c = a.angueraHome ? a.score[1] : a.score[0]; return f > c ? 'V' : f < c ? 'D' : 'E'; });
  let run = 0; for (let i = seq.length - 1; i >= 0 && seq[i] === 'V'; i--) run++;
  const title = run === seq.length && run > 1 ? 'Pleno: <em>' + run + ' de ' + run + '</em> victorias' : run > 1 ? '<em>' + run + '</em> victorias seguidas' : 'Últimos resultados';
  return '<div class="streak"><h3>' + title + '</h3><div class="pills">' + seq.map((r, i) => '<span class="pill" style="background:' + RES[r][1] + ';animation-delay:' + (i * 70) + 'ms">' + r + '</span>').join('') + '</div></div>';
}
function podiumHTML(top){
  if (top.length < 3) return top.length ? '<div class="scorers">' + top.map(([k, n]) => { const [nm, dn] = k.split('#'); return '<div class="scorer"><span class="n">' + esc(dn || '·') + '</span>' + esc(nm) + ' <i>× ' + n + '</i></div>'; }).join('') + '</div>' : '';
  const col = i => { const [k, n] = top[i], [nm, dn] = k.split('#'); return '<div class="pod p' + (i + 1) + '"><span class="n">' + esc(dn || '·') + '</span><span class="nm">' + esc(nm) + '</span><div class="st"><b>' + n + '</b><span>goles</span></div></div>'; };
  return '<div class="shead" style="margin:20px 0 0"><h2>Goleadores</h2></div><div class="podium">' + col(1) + col(0) + col(2) + '</div>';
}
function celebrate(){
  const m = DATA[0]; if (calm() || !m || m.res !== 'V') return;
  try { if (sessionStorage.getItem('atv_party') === m.id) return; sessionStorage.setItem('atv_party', m.id); } catch (e) {}
  setTimeout(() => {
    if (view !== 'home') return;
    const c = document.createElement('canvas'); c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;z-index:75;pointer-events:none'; document.body.appendChild(c);
    const w = c.width = innerWidth, h = c.height = innerHeight, g = c.getContext('2d'), cols = ['#2F45D6', '#FFD21F', '#E0283E', '#ffffff'];
    const ps = Array.from({ length: 130 }, (_, i) => ({ x: i % 2 ? -10 : w + 10, y: h * .55, vx: (i % 2 ? 1 : -1) * (3 + Math.random() * 7), vy: -(8 + Math.random() * 10), s: 5 + Math.random() * 6, c: cols[i % 4], a: Math.random() * 6, va: (Math.random() - .5) * .4 }));
    const t0 = performance.now();
    const step = t => { const k = (t - t0) / 2600; g.clearRect(0, 0, w, h); if (k >= 1) return c.remove();
      ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .32; p.vx *= .99; p.a += p.va; g.save(); g.globalAlpha = 1 - k * k; g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .6); g.restore(); });
      requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }, 1900);
}

// ---- Datos ----
const DEMO_SRC = 'data:text/html;charset=utf-8,' + encodeURIComponent('<body style="margin:0;height:100vh;display:grid;place-items:center;background:#000;color:#a7b0bc;font:600 18px system-ui;text-align:center">DEMO<br><span style="font-weight:400;font-size:14px">Aquí se reproducirá el vídeo del partido desde Drive</span></body>');
const SAMPLE = [['Anguera vs Bufala', 7], ['Badalona vs Anguera', 6], ['Anguera vs Sant Andreu', 5], ['Singuerlín vs Anguera', 4], ['Anguera vs Lloreda', 3], ['Gramanet VS Anguera', 2], ['Anguera vs Sistrells', 1]]
  .map((a, i) => ({ id: 'demo' + i, title: a[0], jornada: a[1], group: 'T26/27 S8', date: null, score: null, sort: 10 - i, videos: [1, 2, 3, 4].map(q => ({ id: 'd' + i + q, name: q + 'QUART.mp4', size: 0 })) }));
function route(){
  const p = new URLSearchParams(location.search), id = p.get('m');
  if (id) { const m = DATA.find(x => x.id === id); if (m) return openMatch(m, true); }
  if (p.get('v') === 'temporada') return renderSeason();
  renderHome();
}
function load(){
  $('#app').innerHTML = '<div class="skel" style="height:520px;border-radius:0"></div><div style="display:flex;gap:12px;padding:26px 18px"><div class="skel" style="flex:0 0 260px;height:230px"></div><div class="skel" style="flex:0 0 260px;height:230px"></div></div>';
  fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(res => { if (!res.matches || !res.matches.length) throw 0; return res.matches; })
    .catch(() => { DEMO = true; document.body.classList.add('demo'); return SAMPLE; })
    .then(list => { DATA = list; return fetch('fcf.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null); })
    .then(f => { FCF = f; mergeFCF(); route(); let seenIntro = false; try { seenIntro = !!sessionStorage.getItem('atv_intro'); sessionStorage.setItem('atv_intro', '1'); } catch (e) {} setTimeout(() => $('#splash').classList.add('off'), seenIntro || calm() ? 200 : Math.max(200, 1600 - performance.now())); });
}

// ---- Eventos ----
$('#home').addEventListener('click', () => renderHome(true));
$('#tHome').addEventListener('click', () => renderHome(true));
$('#tSeason').addEventListener('click', () => renderSeason(true));
$('#tLatest').addEventListener('click', () => { if (DATA[0]) openMatch(DATA[0], false, true); });
$('#openSearch').addEventListener('click', openSearch);
$('#closeSearch').addEventListener('click', closeSearch);
$('#q').addEventListener('input', doSearch);
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (document.querySelector('.stage.pfs')) exitFS(); else if ($('#search').classList.contains('open')) closeSearch(); else if (view === 'watch') renderHome(true); });
window.addEventListener('scroll', () => { $('#top').classList.toggle('solid', scrollY > 40); const b = document.querySelector('.hero .bg'); if (b && scrollY < 900 && !calm()) b.style.transform = 'translateY(' + scrollY * .3 + 'px)'; }, { passive: true });
window.addEventListener('popstate', route);
load();

// ---- Aviso de instalación (solo si no está instalada) ----
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let deferred = null;
function showSheet(){
  if (standalone || store.get('atv_hide_install')) return;
  $('#steps').innerHTML = ios
    ? '<li>Pulsa <b>Compartir</b> en la barra de Safari.</li><li>Elige <b>Añadir a pantalla de inicio</b>.</li><li>Pulsa <b>Añadir</b>.</li>'
    : deferred ? '<li>Pulsa <b>Instalar</b> y confirma.</li>'
    : '<li>Abre el menú <b>⋮</b> del navegador.</li><li>Elige <b>Instalar aplicación</b> o <b>Añadir a pantalla de inicio</b>.</li>';
  $('#install').hidden = !deferred;
  $('#sheet').classList.add('on');
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; if ($('#sheet').classList.contains('on')) showSheet(); });
$('#install').addEventListener('click', async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice.catch(() => {}); deferred = null; $('#sheet').classList.remove('on'); });
$('#later').addEventListener('click', () => { store.set('atv_hide_install', '1'); $('#sheet').classList.remove('on'); });
if (/android|iphone|ipad|ipod/i.test(navigator.userAgent) || ios) setTimeout(showSheet, 4000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
// Botón para volver a abrir el aviso aunque se haya pulsado "Ahora no"
document.addEventListener('click', e => { if (e.target.closest('#installAgain')) { try { localStorage.removeItem('atv_hide_install'); } catch (x) {} showSheet(); } });
}
</script>

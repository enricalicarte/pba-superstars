<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>PB Anguera TV</title>
<meta name="theme-color" content="#07090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anguera TV">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* PB Anguera TV — colores del escudo: amarillo (acción), azul, rojo (avisos) sobre negro de noche de partido. */
:root{--bg:#07090c;--s1:#12161c;--s2:#1b2028;--line:rgba(255,255,255,.09);--ink:#f4f5f7;--mute:#a7b0bc;--acc:#FFD21F;--accInk:#14163a;--red:#E0283E;--blue:#2337B8}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.cond{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.01em}
main{padding-bottom:calc(84px + env(safe-area-inset-bottom))}

/* Barra superior */
.top{position:fixed;inset:0 0 auto;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) max(4vw,14px) 10px;background:linear-gradient(#07090cee,#07090c00);transition:background .2s}
.top.solid{background:#07090cf2;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer}
.brand img{width:34px;height:35px;border-radius:6px}
.brand span{font:900 22px/1 'Barlow Condensed',sans-serif;letter-spacing:.02em}
.brand b{color:var(--acc)}
.demotag{display:none;font:700 11px system-ui;color:#141100;background:#a7b0bc;border-radius:5px;padding:3px 6px}
body.demo .demotag{display:inline-block}
.sp{flex:1}
.icon{width:44px;height:44px;border-radius:22px;border:0;background:#ffffff14;display:grid;place-items:center;cursor:pointer;flex:none}

/* Escudos y equipos */
.crest{display:block;border-radius:18%;box-shadow:0 6px 18px #0009;object-fit:cover}
.kit{border-radius:50%;border:3px solid #fff;display:grid;place-items:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;flex:none}
.team{display:flex;flex-direction:column;align-items:center;gap:8px;width:110px;text-align:center}
.team .nm{font:800 20px/1.05 'Barlow Condensed',sans-serif;text-transform:uppercase;text-wrap:balance}
.vsrow{display:flex;align-items:center;justify-content:center;gap:6px}
.vsx{font:900 40px/1 'Barlow Condensed',sans-serif;flex:1;text-align:center;white-space:nowrap}
.vsx.sc{color:var(--acc)}

/* Portada */
.hero{position:relative;height:min(78vh,600px);min-height:500px;overflow:hidden;background:#13201a}
.hero .bg{position:absolute;inset:0;background:radial-gradient(60% 45% at 78% 8%,#fff3c455,transparent 60%),linear-gradient(180deg,#1b2a1e,#2f6b3a 45%,#1c4426)}
.hero .bg img{width:100%;height:100%;object-fit:cover;animation:kb 14s ease-in-out infinite alternate;transform-origin:60% 40%}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#07090c 5%,#07090cd9 38%,#07090c33 75%,#07090c99)}
.hero .in{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:0 max(5vw,18px) 24px;display:flex;flex-direction:column;gap:14px;max-width:620px;margin:0 auto}
.tag{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:13px;color:var(--acc);letter-spacing:.02em}
.tag i{width:8px;height:8px;border-radius:4px;background:var(--red);box-shadow:0 0 0 4px #E0283E33}
.meta{text-align:center;color:var(--mute);font-size:14px}
.btn{height:50px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:var(--s1);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--acc);color:var(--accInk);border-color:var(--acc);font-weight:800;font-size:17px}
.dots{display:flex;justify-content:center;gap:6px}
.dots button{width:8px;height:8px;padding:0;border:0;border-radius:4px;background:#ffffff55;cursor:pointer;transition:width .25s}
.dots button.on{width:24px;background:#fff}

/* Secciones y carriles */
.sec{margin-top:26px}
.shead{display:flex;align-items:baseline;gap:10px;padding:0 max(4vw,18px);margin-bottom:12px}
.shead h2{font:800 22px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:0;flex:1}
.shead .lnk{background:none;border:0;color:var(--mute);font-weight:600;font-size:14px;cursor:pointer;padding:6px 0}
.row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px max(4vw,18px) 8px;scroll-padding-inline:max(4vw,18px);scrollbar-width:none}
.row::-webkit-scrollbar{display:none}

/* Tarjeta tipo marcador */
.card{all:unset;flex:0 0 clamp(240px,70vw,290px);scroll-snap-align:start;cursor:pointer;border-radius:16px;overflow:hidden;background:var(--s1);border:1px solid var(--line);display:block;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.thumb{position:relative;aspect-ratio:16/8;background:linear-gradient(165deg,#2a3d2b,#2f6b3a 55%,#204d2a);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:10px;top:10px;background:#07090c;font:800 15px/1 'Barlow Condensed',sans-serif;padding:6px 8px;border-radius:7px;white-space:nowrap}
.badge.new{background:var(--red)}
.dur{position:absolute;right:10px;bottom:10px;background:#000000b3;font-size:12px;font-weight:600;padding:3px 7px;border-radius:6px;white-space:nowrap}
.seen{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--acc)}
.mini{display:flex;align-items:center;gap:8px;padding:12px 12px 4px}
.mini .vs{flex:1;text-align:center;font:800 16px 'Barlow Condensed',sans-serif;color:var(--mute);white-space:nowrap}
.mini .vs.sc{color:var(--acc);font-size:20px}
.ctitle{padding:0 12px 14px;font-weight:600;font-size:15px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Cuadrícula de temporada */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 max(4vw,18px)}
@media(min-width:700px){.grid{grid-template-columns:repeat(8,minmax(0,1fr))}}
.cell{all:unset;cursor:pointer;height:64px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--s1);border:1px solid var(--line);text-align:center}
.cell:focus-visible{outline:2px solid var(--acc)}
.cell b{font:900 20px/1 'Barlow Condensed',sans-serif}
.cell span{font-size:11px;font-weight:600;color:var(--mute);max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.last{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.cell.last span{color:#3b3d12}
.cell.seen{box-shadow:inset 0 -3px 0 var(--acc)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 max(4vw,18px) 4px;scrollbar-width:none}
.chip{flex:none;height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Página del partido */
.mhead{position:relative;overflow:hidden;padding:calc(env(safe-area-inset-top) + 72px) max(5vw,18px) 22px}
.mhead .bg{position:absolute;inset:-30px;background:linear-gradient(180deg,#24402a,#2f6b3a 60%,#1c3a22)}
.mhead .bg img{width:100%;height:100%;object-fit:cover;filter:blur(18px) saturate(1.2)}
.mhead::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#07090c 0%,#07090cbf 55%,#07090c80)}
.mhead .in{position:relative;z-index:1;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.stage{width:100%;max-width:1100px;margin:0 auto;aspect-ratio:16/9;background:#000;position:relative}
.vid{position:absolute;inset:0;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;transform-origin:0 0}
.zpad{position:absolute;inset:0;display:none;touch-action:none;cursor:grab;z-index:2}
.zoomon .zpad,.native .zpad{display:block}
.vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:0 0;display:none;background:#000}
.native video{display:block}.native iframe{display:none}
/* Controles del reproductor propio */
.ctl{position:absolute;inset:0;z-index:4;display:none;flex-direction:column;pointer-events:none;opacity:0;transition:opacity .25s}
.ctl::before{content:"";position:absolute;inset:0;background:linear-gradient(#000a 0%,#0000 28%,#0000 55%,#000c 100%);z-index:-1}
.native .ctl{display:flex}
.ctl.on{opacity:1}
.ctl.on button,.ctl.on .bar{pointer-events:auto}
.native .fsbar{display:none!important}
.isnative .fsrow{display:none}
.ctop{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--sat,0px)) 12px 0}
.stage:fullscreen .ctop,.stage:-webkit-full-screen .ctop,.stage.pfs .ctop{--sat:env(safe-area-inset-top)}
.stage:fullscreen .cbot,.stage.pfs .cbot{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.qpill{background:var(--acc);color:var(--accInk);font:900 15px/1 'Barlow Condensed',sans-serif;padding:5px 8px;border-radius:6px;flex:none}
.ctop .ttl{font-weight:700;font-size:14px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 3px #000}
.ib{width:40px;height:40px;border-radius:20px;border:0;background:#ffffff1f;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;padding:0;font:800 13px Barlow,sans-serif}
.ib:disabled{opacity:.3}
.ib.on{background:var(--acc);color:var(--accInk)}
.cmid{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(28px,10vw,80px)}
.cb{width:52px;height:52px;border-radius:50%;border:0;background:#0000008c;color:#fff;display:grid;place-items:center;cursor:pointer;position:relative;padding:0;backdrop-filter:blur(4px)}
.cb.big{width:68px;height:68px;background:#ffffffeb;color:#07090c}
.cb small{position:absolute;inset:0;display:grid;place-items:center;font:800 9px Barlow,sans-serif;padding-top:2px}
.cbot{padding:0 12px 8px}
.bar{position:relative;height:26px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.bar .tr{position:absolute;left:0;right:0;height:4px;border-radius:2px;background:#ffffff40;overflow:hidden;transition:height .15s}
.bar:hover .tr,.bar.drag .tr{height:7px}
.bar .bf{position:absolute;left:0;top:0;bottom:0;background:#ffffff59}
.bar .pl{position:absolute;left:0;top:0;bottom:0;background:var(--acc)}
.bar .th{position:absolute;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px #ffd21f40;transition:transform .15s}
.bar.drag .th{transform:scale(1.25)}
.bar .bub{position:absolute;bottom:26px;transform:translateX(-50%);background:#fff;color:#07090c;font:800 13px Barlow,sans-serif;padding:3px 8px;border-radius:6px;display:none;white-space:nowrap}
.bar.drag .bub{display:block}
.crow{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.crow .tm{flex:1;text-shadow:0 1px 3px #000}
.crow .tm span{color:#ffffffa6}
.spd{width:auto;min-width:44px;padding:0 10px}
.ripple{position:absolute;top:0;bottom:0;width:40%;z-index:3;display:grid;place-items:center;color:#fff;font:800 17px Barlow,sans-serif;opacity:0;transition:opacity .4s;pointer-events:none;text-shadow:0 1px 4px #000}
.ripple.l{left:0;border-radius:0 50% 50% 0/0 100% 100% 0;background:linear-gradient(90deg,#ffffff2a,#ffffff10)}
.ripple.r{right:0;border-radius:50% 0 0 50%/100% 0 0 100%;background:linear-gradient(270deg,#ffffff2a,#ffffff10)}
.ripple.on{opacity:1;transition:none}
.resume{position:absolute;left:12px;bottom:64px;z-index:5;display:none;align-items:center;gap:8px;background:#000d;color:#fff;font-size:13px;font-weight:600;padding:6px 6px 6px 12px;border-radius:20px}
.resume.on{display:flex}
.resume button{height:30px;border-radius:15px;border:0;background:#ffffff26;color:#fff;font:700 13px Barlow,sans-serif;padding:0 10px;cursor:pointer}
.spin{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;border:4px solid #ffffff33;border-top-color:var(--acc);animation:sp 1s linear infinite;z-index:3;display:none}
.native.loading .spin{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.zoomon .vid{box-shadow:inset 0 0 0 3px var(--acc)}
.zhint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#000c;color:#fff;font-size:13px;font-weight:600;padding:6px 12px;border-radius:16px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .3s;z-index:3}
.zhint.on{opacity:1}
.fsb.on{background:var(--acc);color:var(--accInk)}
.wbody{max-width:1100px;margin:0 auto;padding:16px max(4vw,18px) 0;display:flex;flex-direction:column;gap:12px}
.qtabs{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:8px}
.qtab{height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--s1);font:900 20px 'Barlow Condensed',sans-serif;cursor:pointer}
.qtab.on{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.two{display:flex;gap:8px}
.two .btn{flex:1;height:46px;font-weight:600;font-size:15px}
.fsrow{display:flex;gap:8px}.fsrow .pri{flex:1}.fsrow .zbtn{flex:none;width:auto;padding:0 16px;height:50px}
.zbtn.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}

/* Pantalla completa (real o simulada en iPhone): controles en columna, nunca encima del vídeo */
.stage:fullscreen{max-width:none;width:100vw;height:100vh;aspect-ratio:auto;display:flex}
.stage:-webkit-full-screen{max-width:none;width:100vw;height:100vh;aspect-ratio:auto;display:flex}
.stage.pfs{position:fixed;inset:0;z-index:60;max-width:none;width:100vw;height:100vh;height:100dvh;aspect-ratio:auto;display:flex}
.stage:fullscreen .vid,.stage:-webkit-full-screen .vid,.stage.pfs .vid{position:relative;inset:auto;flex:1;min-width:0;height:100%}
.fsbar{display:none;flex:none;align-items:center;justify-content:center;gap:10px;background:#000;padding:calc(env(safe-area-inset-top) + 8px) 8px 8px calc(env(safe-area-inset-left) + 8px)}
.stage:fullscreen .fsbar,.stage:-webkit-full-screen .fsbar,.stage.pfs .fsbar{display:flex;flex-direction:column;width:calc(env(safe-area-inset-left) + 64px)}
.fsb{width:48px;height:48px;border-radius:50%;border:0;background:#1b2028;color:#fff;font:800 16px 'Barlow Condensed',sans-serif;display:grid;place-items:center;cursor:pointer;padding:0}
#fsName{background:transparent;color:var(--acc);font-size:18px;height:auto}
.fsb[hidden]{display:none}
.fsb:disabled{opacity:.25;cursor:default}
@media (orientation:portrait){
  .stage:fullscreen,.stage:-webkit-full-screen,.stage.pfs{flex-direction:column}
  .stage:fullscreen .fsbar,.stage:-webkit-full-screen .fsbar,.stage.pfs .fsbar{flex-direction:row;width:auto;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
}

/* Menú inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#0d1015f2;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;height:64px;border:0;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;cursor:pointer}
.tabs button.on{color:var(--acc);font-weight:700}

/* Buscar */
.search{position:fixed;inset:0;z-index:40;background:#07090cf7;display:none;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 0 100px}
.search.open{display:block}
.sbar{display:flex;gap:10px;padding:0 max(4vw,18px);margin-bottom:18px}
.sbar input{flex:1;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--s1);padding:0 16px;font-size:17px}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px;padding:0 max(4vw,18px)}
.results .card{flex:none}

/* Carga */
.skel{background:linear-gradient(90deg,#12161c,#1b2028,#12161c);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:16px}
@keyframes sk{to{background-position:-200% 0}}
.center{min-height:70vh;display:grid;place-items:center;text-align:center;padding:100px 20px;color:var(--mute)}
.splash{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:var(--bg);transition:opacity .4s}
.splash.off{opacity:0;pointer-events:none}
.splash img{width:110px;border-radius:18px;animation:pl 1.4s ease-in-out infinite}
@keyframes pl{50%{transform:scale(.93);opacity:.75}}
.view{animation:fi .25s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(6px)}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:90}
.toast.on{opacity:1}

/* Aviso de instalación */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#151a21;border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px #000a;transform:translateY(110%);transition:transform .35s}
.sheet.on{transform:none}
.sheet h2{margin:0 0 6px;font-size:20px}
.sheet p{margin:0 0 12px;color:var(--mute);font-size:15px}
.sheet ol{margin:0 0 16px;padding-left:20px}
.sheet li{margin:6px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="splash" id="splash"><img src="icons/escudo.png" alt="PB Anguera"></div>

<header class="top" id="top">
  <button class="brand" id="home" aria-label="Inicio"><img src="icons/escudo.png" alt=""><span>ANGUERA <b>TV</b></span></button>
  <span class="demotag">DEMO</span>
  <div class="sp"></div>
  <button class="icon" id="openSearch" aria-label="Buscar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
</header>

<main id="app"></main>

<nav class="tabs" aria-label="Secciones">
  <button id="tHome" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg>Inicio</button>
  <button id="tSeason"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>Temporada</button>
  <button id="tSearch"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Buscar</button>
</nav>

<section class="search" id="search" role="dialog" aria-label="Buscar partidos">
  <div class="sbar"><input id="q" type="search" placeholder="Rival, jornada, temporada…" aria-label="Buscar"><button class="btn" id="closeSearch">Cerrar</button></div>
  <div class="results" id="results"></div>
</section>

<div class="toast" id="toast"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Instalar la app">
  <h2>Instala Anguera TV</h2>
  <p>Tendrás los partidos en la pantalla de inicio, como una app.</p>
  <ol id="steps"></ol>
  <div class="two"><button class="btn" id="later">Ahora no</button><button class="btn pri" id="install" hidden>Instalar</button></div>
</div>

<script>
{
const CREST = 'icons/escudo.png';
const APP_URL = location.origin + location.pathname;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} } };
const MONTHS = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
let DATA = [], DEMO = false, view = 'home', current = null, part = 0, startId = null, heroIdx = 0, heroTimer = null, seasonGroup = '';
let seen = (() => { try { return JSON.parse(store.get('partidos_seen') || '[]'); } catch (e) { return []; } })();

// ---- Utilidades ----
const fmtDate = ms => { if (!ms) return ''; const d = new Date(ms); return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); };
const thumb = (id, w) => 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + (w || 640);
const isNew = m => !!m.date && Date.now() - m.date < 8 * 864e5;
const partName = n => { const b = String(n).replace(/\.[^.]+$/, ''); const q = b.match(/^\s*(?:(\d)\s*(?:r|n|t|º)?\s*quart|q\s*(\d)(?!\d))/i); return q ? 'Quart ' + (q[1] || q[2]) : b.replace(/_/g, ' '); };
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const teams = t => { const p = String(t).split(/\s+(?:vs\.?|v|contra|-|–)\s+/i); return p.length === 2 ? p.map(x => x.trim()) : null; };

function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 1800); }

// ---- Rivales: colores de su primera equipación (FCF, Prebenjamí S8 grup 3) ----
const KITS = [
  [/bufal/, 'BUF', 'linear-gradient(180deg,#E30613 60%,#111 60%)', '#fff'],
  [/badalona/, 'BAD', 'linear-gradient(160deg,#1530D6 42%,#fff 42% 56%,#1530D6 56%)', '#fff'],
  [/sing(u)?erl/, 'SIN', 'repeating-linear-gradient(90deg,#22C55E 0 6px,#fff 6px 12px)', '#07360f'],
  [/sistrells/, 'SIS', 'linear-gradient(180deg,#1530D6 72%,#FFE600 72%)', '#fff'],
  [/lloreda/, 'LLO', 'linear-gradient(135deg,#E30613 40%,#fff 40% 55%,#E30613 55%)', '#fff'],
  [/stoitchkov|racing/, 'RAC', 'linear-gradient(180deg,#f2f2f2 60%,#8B1E1E 60%)', '#8B1E1E'],
  [/grama|gramanet|gramenet/, 'GRA', 'linear-gradient(180deg,#1530D6 60%,#fff 60%)', '#fff'],
  [/alzamora/, 'ALZ', 'repeating-linear-gradient(135deg,#E30613 0 8px,#fff 8px 12px)', '#fff']
];
const code = n => { const w = norm(n).replace(/\b(cf|c\.f\.|ue|ud|fc|ce|ef|ff|fe|club|futbol|de|del|la|el)\b/g, ' ').trim().split(/\s+/)[0] || '?'; return w.slice(0, 3).toUpperCase(); };
function badge(name, size){
  if (isAng(name)) return '<img class="crest" src="' + CREST + '" alt="PB Anguera" style="width:' + size + 'px;height:' + Math.round(size * 1.02) + 'px">';
  const k = KITS.find(x => x[0].test(norm(name)));
  const [c, bg, ink] = k ? [k[1], k[2], k[3]] : [code(name), '#3a414c', '#fff'];
  return '<div class="kit" role="img" aria-label="' + esc(name) + '" style="width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size * .33) + 'px;background:' + bg + ';color:' + ink + ';text-shadow:' + (ink === '#fff' ? '0 1px 3px #000' : 'none') + '">' + esc(c) + '</div>';
}
const rival = m => { const t = teams(m.title); return t ? (isAng(t[0]) ? t[1] : t[0]) : ''; };
function matchup(m, size){
  const t = teams(m.title);
  if (!t) return '<div class="vsrow">' + badge('Anguera', size) + '</div><div class="team" style="width:auto"><div class="nm">' + esc(m.title) + '</div></div>';
  const mid = m.score ? '<div class="vsx sc">' + esc(m.score.replace('-', ' – ')) + '</div>' : '<div class="vsx">VS</div>';
  return '<div class="vsrow">' + t.map((n, i) => (i ? mid : '') + '<div class="team">' + badge(n, size) + '<div class="nm">' + esc(isAng(n) ? 'Anguera' : n) + '</div></div>').join('') + '</div>';
}

// ---- Tarjetas y celdas ----
function card(m){
  const s = seen.includes(m.id), t = teams(m.title);
  const label = isNew(m) && !s ? '<span class="badge new">NUEVO</span>' : (m.jornada ? '<span class="badge">J' + m.jornada + '</span>' : (m.date ? '<span class="badge">' + esc(fmtDate(m.date)) + '</span>' : ''));
  return '<button class="card" data-id="' + esc(m.id) + '"><div class="thumb"><img loading="lazy" alt="" src="' + thumb(m.videos[0].id) + '" onerror="this.remove()">' + label +
    '<span class="dur">' + m.videos.length + (m.videos.length === 1 ? ' vídeo' : ' cuartos') + '</span>' + (s ? '<span class="seen"></span>' : '') + '</div>' +
    (t ? '<div class="mini">' + badge(t[0], 36) + '<span class="vs' + (m.score ? ' sc' : '') + '">' + esc(m.score || 'VS') + '</span>' + badge(t[1], 36) + '</div>' : '<div class="mini">' + badge('Anguera', 36) + '</div>') +

const rail = (title, list, more) => list.length ? '<section class="sec"><div class="shead"><h2>' + esc(title) + '</h2>' + (more ? '<button class="lnk" data-season="' + esc(more) + '">Ver todos</button>' : '') + '</div><div class="row">' + list.map(card).join('') + '</div></section>' : '';

}

const groups = () => [...new Set(DATA.map(m => m.group).filter(Boolean))];

// ---- Inicio ----

    matchup(m, 68) +
    '<div class="meta">' + esc([fmtDate(m.date), m.group, m.videos.length + (m.videos.length === 1 ? ' vídeo' : ' cuartos')].filter(Boolean).join('  ·  ')) + '</div>' +
    '<button class="btn pri" id="heroPlay"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>Ver partido</button>' +

// ---- Temporada ----
function renderSeason(push){

  const gs = groups(); if (!seasonGroup || !gs.includes(seasonGroup)) seasonGroup = gs[0] || '';

    '<div class="chips">' + gs.map(g => '<button class="chip' + (g === seasonGroup ? ' on' : '') + '" data-g="' + esc(g) + '">' + esc(g) + '</button>').join('') + '</div>' +
    '<section class="sec" style="margin-top:18px"><div class="shead"><h2>' + esc(seasonGroup || 'Partidos') + '</h2></div>' + (seasonGroup ? seasonGrid(seasonGroup) : '') + '</section>' +

      '<div class="cmid"><button class="cb" id="cBack" aria-label="Retroceder 10 segundos">' + RW + '<small>10</small></button><button class="cb big" id="cPlay" aria-label="Reproducir">' + PLAYI + '</button><button class="cb" id="cFwd" aria-label="Avanzar 10 segundos">' + FW + '<small>10</small></button></div>' +

    '<div class="fsrow"><button class="btn pri" id="fsGo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Pantalla completa</button><button class="btn zbtn zt" aria-pressed="false">' + ZICO + 'Zoom</button></div>' +
    '<div class="two"><button class="btn" id="share">Copiar enlace</button><a class="btn" id="open" target="_blank" rel="noopener">Abrir en Drive</a></div></div>' +

  $('#fsReset').addEventListener('click', () => { Z = { s: 1, x: 0, y: 0 }; applyZ(); });

function play(i){
  const v = current.videos[i]; part = i;
  Z = { s: 1, x: 0, y: 0 }; applyZ();
  loadMedia(v); if ($('#resume')) $('#resume').classList.remove('on'); syncQ(); drawBar(0);
  $('#open').href = 'https://drive.google.com/file/d/' + encodeURIComponent(v.id) + '/view';
  document.querySelectorAll('.qtab').forEach(b => b.classList.toggle('on', +b.dataset.q === i));
  const many = current.videos.length > 1, q = partName(v.name).match(/^Quart (\d)$/);
  $('#fsName').textContent = q ? 'Q' + q[1] : (i + 1) + '/' + current.videos.length;
  $('#fsName').hidden = $('#fsPrev').hidden = $('#fsNext').hidden = !many;
  $('#fsPrev').disabled = i === 0; $('#fsNext').disabled = i === current.videos.length - 1;

// ---- Reproductor propio (lee el vídeo de Drive). Si Drive no lo deja, vuelve al reproductor de Drive ----
const PLAYI = '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>';
const PAUSEI = '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
const RW = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg>';
const FW = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5"/></svg>';

const media = () => mode === 'native' ? $('#vplayer') : $('#frame');
const fmtT = t => { t = Math.max(0, Math.floor(t || 0)); const m = Math.floor(t / 60), s = t % 60; return m + ':' + String(s).padStart(2, '0'); };
function setMode(m){
  mode = m; const st = document.querySelector('.stage'); if (st) st.classList.toggle('native', m === 'native');
  const wb = document.querySelector('.wbody'); if (wb) wb.classList.toggle('isnative', m === 'native');
  $('#frame').style.transform = ''; $('#vplayer').style.transform = '';
}
function loadMedia(v){
  const vid = $('#vplayer'), f = $('#frame');
  if (DEMO || nativeBroken) {
    setMode('drive'); vid.removeAttribute('src');
    f.src = DEMO ? DEMO_SRC : 'https://drive.google.com/file/d/' + encodeURIComponent(v.id) + '/preview';
    return;
  }
  setMode('native'); f.src = 'about:blank';
  document.querySelector('.stage').classList.add('loading');
  vid.poster = thumb(v.id, 1280);
  vid.dataset.id = v.id;
  vid.src = 'https://drive.usercontent.google.com/download?id=' + encodeURIComponent(v.id) + '&export=download&confirm=t';
  vid.playbackRate = +($('#cSpeed').textContent.replace('x', '')) || 1;
  const p = vid.play(); if (p && p.catch) p.catch(() => {});
  showCtl();
}
function fallbackToDrive(){
  if (mode !== 'native' || !current) return;
  nativeBroken = true; try { sessionStorage.setItem('atv_native_off', '1'); } catch (e) {}
  const v = current.videos[part]; const vid = $('#vplayer'); vid.removeAttribute('src'); vid.load();
  document.querySelector('.stage').classList.remove('loading');
  setMode('drive'); $('#frame').src = 'https://drive.google.com/file/d/' + encodeURIComponent(v.id) + '/preview';
  toast('Usando el reproductor de Drive');
}
const PREVQ = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>';
const NEXTQ = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>';
const FSI = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const FSX = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
const POS_KEY = 'atv_pos';
const getPos = () => { try { return JSON.parse(store.get(POS_KEY) || '{}'); } catch (e) { return {}; } };
function savePos(id, t, d){ const p = getPos(); if (t > 15 && t < d - 20) p[id] = Math.floor(t); else delete p[id]; const k = Object.keys(p); if (k.length > 200) delete p[k[0]]; store.set(POS_KEY, JSON.stringify(p)); }
let rip = { side: 0, n: 0, t: null };
function seekBy(d){
  const v = $('#vplayer'); if (mode !== 'native' || !isFinite(v.duration)) return;
  v.currentTime = Math.min(v.duration, Math.max(0, v.currentTime + d));
  const side = d < 0 ? -1 : 1; rip.n = rip.side === side ? rip.n + 1 : 1; rip.side = side;
  const r = $(side < 0 ? '#rl' : '#rr'); r.textContent = side < 0 ? '«  ' + rip.n * 10 + ' s' : rip.n * 10 + ' s  »';
  r.classList.add('on'); clearTimeout(rip.t); rip.t = setTimeout(() => { r.classList.remove('on'); rip = { side: 0, n: 0, t: null }; }, 700);
  drawBar(); showCtl();
}
function togglePlay(){ const v = $('#vplayer'); if (v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => {}); } else v.pause(); showCtl(); }
function showCtl(){ const c = $('#ctl'); if (!c) return; c.classList.add('on'); clearTimeout(ctlT); ctlT = setTimeout(() => { const v = $('#vplayer'); if (v && !v.paused && !seeking) c.classList.remove('on'); }, 3200); }
function hideCtl(){ const c = $('#ctl'); if (c) c.classList.remove('on'); }
function drawBar(ratio){
  const v = $('#vplayer'); if (!v || !$('#cBar')) return;
  const d = v.duration, r = ratio != null ? ratio : (isFinite(d) && d ? v.currentTime / d : 0);
  $('#cPl').style.width = (r * 100) + '%'; $('#cTh').style.left = (r * 100) + '%';
  $('#cTime').textContent = fmtT(r * (d || 0));
  if (v.buffered.length && isFinite(d)) $('#cBuf').style.width = (v.buffered.end(v.buffered.length - 1) / d * 100) + '%';
  $('#cBar').setAttribute('aria-valuenow', Math.round(r * 100));
}
function syncQ(){
  if (!current || !$('#cQ')) return;
  const n = current.videos.length, q = partName(current.videos[part].name).match(/^Quart (\d)$/);
  $('#cQ').textContent = q ? 'Q' + q[1] : (n > 1 ? (part + 1) + '/' + n : 'Vídeo');
  if ($('#cPrevQ')) { $('#cPrevQ').disabled = part === 0; $('#cNextQ').disabled = part === n - 1; }
  $('#cFS').innerHTML = isFS() ? FSX : FSI;
}
function bindPlayer(){
  const v = $('#vplayer'), st = document.querySelector('.stage');
  v.addEventListener('error', fallbackToDrive);
  v.addEventListener('loadedmetadata', () => {
    $('#cDur').textContent = fmtT(v.duration); drawBar();
    const t = getPos()[v.dataset.id];
    if (t && t < v.duration - 20) {
      v.currentTime = t; $('#resumeTxt').textContent = 'Continúas en ' + fmtT(t); $('#resume').classList.add('on');
      setTimeout(() => $('#resume') && $('#resume').classList.remove('on'), 5000);
    }
  });
  ['waiting', 'loadstart'].forEach(ev => v.addEventListener(ev, () => st.classList.add('loading')));
  ['playing', 'canplay', 'pause'].forEach(ev => v.addEventListener(ev, () => st.classList.remove('loading')));
  let lastSave = 0;
  v.addEventListener('timeupdate', () => {
    if (!seeking) drawBar();
    if (Date.now() - lastSave > 4000 && isFinite(v.duration)) { lastSave = Date.now(); savePos(v.dataset.id, v.currentTime, v.duration); }
  });
  v.addEventListener('progress', () => { if (!seeking) drawBar(); });
  const sync = () => { $('#cPlay').innerHTML = v.paused ? PLAYI : PAUSEI; $('#cPlay').setAttribute('aria-label', v.paused ? 'Reproducir' : 'Pausa'); if (v.paused) showCtl(); };
  v.addEventListener('play', sync); v.addEventListener('pause', sync);
  v.addEventListener('ended', () => { savePos(v.dataset.id, 0, 1); if (current && part < current.videos.length - 1) { play(part + 1); toast(partName(current.videos[part].name)); } });
  $('#cPlay').addEventListener('click', togglePlay);
  $('#cBack').addEventListener('click', () => seekBy(-10));
  $('#cFwd').addEventListener('click', () => seekBy(10));
  if ($('#cPrevQ')) { $('#cPrevQ').addEventListener('click', () => { play(part - 1); showCtl(); }); $('#cNextQ').addEventListener('click', () => { play(part + 1); showCtl(); }); }
  $('#cFS').addEventListener('click', () => { isFS() ? exitFS() : enterFS(); setTimeout(syncQ, 300); showCtl(); });
  $('#cZoom').addEventListener('click', () => { setZoomMode(true); showCtl(); });
  $('#resumeStart').addEventListener('click', () => { v.currentTime = 0; $('#resume').classList.remove('on'); });
  const SPEEDS = [1, 1.5, 2, 0.5];
  $('#cSpeed').addEventListener('click', () => { const n = SPEEDS[(SPEEDS.indexOf(v.playbackRate) + 1) % SPEEDS.length]; v.playbackRate = n; $('#cSpeed').textContent = n + 'x'; $('#cSpeed').classList.toggle('on', n !== 1); showCtl(); });
  // Barra: tocar o arrastrar para saltar, con burbuja de tiempo
  const bar = $('#cBar');
  const ratioAt = e => { const r = bar.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
  const preview = r => { drawBar(r); $('#cBub').style.left = (r * 100) + '%'; $('#cBub').textContent = fmtT(r * (v.duration || 0)); };
  bar.addEventListener('pointerdown', e => { if (!isFinite(v.duration)) return; seeking = true; bar.setPointerCapture(e.pointerId); bar.classList.add('drag'); preview(ratioAt(e)); showCtl(); });
  bar.addEventListener('pointermove', e => { if (!seeking) return; preview(ratioAt(e)); showCtl(); });
  const end = e => { if (!seeking) return; v.currentTime = ratioAt(e) * v.duration; seeking = false; bar.classList.remove('drag'); drawBar(); showCtl(); };
  bar.addEventListener('pointerup', end); bar.addEventListener('pointercancel', () => { seeking = false; bar.classList.remove('drag'); drawBar(); });
  bar.addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); e.stopPropagation(); seekBy(e.key === 'ArrowLeft' ? -10 : 10); } });
}
document.addEventListener('keydown', e => {
  if (view !== 'watch' || mode !== 'native' || /INPUT|TEXTAREA/.test(document.activeElement.tagName) && document.activeElement.id !== 'cSeek') return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); seekBy(-10); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); seekBy(10); }
  else if (e.key === ' ' || e.key === 'k') { e.preventDefault(); togglePlay(); }
});

// ---- Zoom: pellizcar y arrastrar sobre el vídeo; con el reproductor propio, toques = controles y doble toque = ±10 s ----
const ZICO = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M11 8v6M8 11h6"/></svg>';
let Z = { s: 1, x: 0, y: 0 }, zoomMode = false;
function applyZ(){
  const box = document.querySelector('.vid'); if (!box || !$('#frame')) return;
  const f = media(), w = box.clientWidth, h = box.clientHeight;
  Z.s = Math.min(5, Math.max(1, Z.s));
  Z.x = Math.min(0, Math.max(w - w * Z.s, Z.x)); Z.y = Math.min(0, Math.max(h - h * Z.s, Z.y));
  f.style.transform = Z.s === 1 ? '' : 'translate(' + Z.x + 'px,' + Z.y + 'px) scale(' + Z.s + ')';
  const r = $('#fsReset'); if (r) r.hidden = Z.s === 1;
}
function zoomAt(px, py, ns){ Z.x = px - (px - Z.x) * (ns / Z.s); Z.y = py - (py - Z.y) * (ns / Z.s); Z.s = ns; applyZ(); }
function setZoomMode(on){
  const b = document.querySelector('.vid'); if (!b) return;
  if (mode === 'native') {   // con el reproductor propio el zoom siempre está disponible: el botón alterna 1x / 2x
    zoomAt(b.clientWidth / 2, b.clientHeight / 2, Z.s > 1.05 ? 1 : 2);
    document.querySelectorAll('.zt').forEach(x => { x.classList.toggle('on', Z.s > 1); x.setAttribute('aria-pressed', Z.s > 1); });
    hint(Z.s > 1 ? 'Pellizca para ampliar · arrastra para moverte' : ''); return;
  }
  zoomMode = on;
  document.querySelector('.stage').classList.toggle('zoomon', on);
  document.querySelectorAll('.zt').forEach(x => { x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
  hint(on ? 'Pellizca para ampliar · arrastra para moverte' : 'Zoom fijado · toca el vídeo para play/pausa');
  if (on && Z.s === 1) zoomAt(b.clientWidth / 2, b.clientHeight / 2, 2);
}
function hint(t){ const h = $('#zhint'); if (!h || !t) return; h.textContent = t; h.classList.add('on'); clearTimeout(hint.t); hint.t = setTimeout(() => h.classList.remove('on'), 2200); }
function bindZoom(pad){
  const pts = new Map(); let last = null, lastTap = 0, tapT = null, down = null, moved = false;
  const local = e => { const r = pad.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  pad.addEventListener('pointerdown', e => {
    pad.setPointerCapture(e.pointerId); pts.set(e.pointerId, local(e)); last = null;
    if (pts.size === 1) { down = { t: Date.now(), p: local(e) }; moved = false; } else moved = true;
  });
  pad.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId), cur = local(e); pts.set(e.pointerId, cur);
    if (down && Math.hypot(cur[0] - down.p[0], cur[1] - down.p[1]) > 10) moved = true;
    if (pts.size === 1) { if (Z.s > 1) { Z.x += cur[0] - prev[0]; Z.y += cur[1] - prev[1]; applyZ(); } return; }
    const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    if (last) { Z.x += mx - last.mx; Z.y += my - last.my; zoomAt(mx, my, Z.s * d / last.d); document.querySelectorAll('.zt').forEach(x => x.classList.toggle('on', Z.s > 1 || zoomMode)); }
    last = { d, mx, my };
  });
  const up = e => {
    pts.delete(e.pointerId); last = null;
    if (pts.size || !down || moved || Date.now() - down.t > 300) return;
    const [x] = down.p, w = pad.clientWidth, now = Date.now();
    if (now - lastTap < 300) {            // doble toque
      clearTimeout(tapT); lastTap = 0;
      if (mode === 'native') { if (x < w * .4) seekBy(-10); else if (x > w * .6) seekBy(10); else togglePlay(); }
      else zoomAt(down.p[0], down.p[1], Z.s > 1.2 ? 1 : 2.5);
      return;
    }
    lastTap = now;
    if (mode === 'native') tapT = setTimeout(() => { const c = $('#ctl'); c.classList.contains('on') ? hideCtl() : showCtl(); }, 260);
  };
  pad.addEventListener('pointerup', up); pad.addEventListener('pointercancel', e => { pts.delete(e.pointerId); last = null; });
  pad.addEventListener('wheel', e => { e.preventDefault(); const [x, y] = local(e); zoomAt(x, y, Z.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15)); }, { passive: false });
}
window.addEventListener('resize', () => applyZ());

function leaveWatch(){
  zoomMode = false; Z = { s: 1, x: 0, y: 0 };
  const vp = $('#vplayer'); if (vp) { vp.pause(); vp.removeAttribute('src'); vp.load(); }
  if (document.fullscreenElement || document.webkitFullscreenElement) exitFS();
  document.body.style.overflow = ''; current = null; clearInterval(heroTimer);
}

// ---- Pantalla completa ----
const isFS = () => !!(document.fullscreenElement || document.webkitFullscreenElement) || !!document.querySelector('.stage.pfs');
function pseudoFS(on){ const st = document.querySelector('.stage'); if (st) st.classList.toggle('pfs', on); document.body.style.overflow = on ? 'hidden' : ''; if (current && $('#cFS')) syncQ(); }
function enterFS(){
  const st = document.querySelector('.stage'); if (!st || isFS()) return;
  const req = st.requestFullscreen || st.webkitRequestFullscreen;
  if (!req) return pseudoFS(true);
  try {
    const p = req.call(st, { navigationUI: 'hide' });
    Promise.resolve(p).then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => pseudoFS(true));
  } catch (e) { pseudoFS(true); }
}
function exitFS(){
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  pseudoFS(false);
}
const onFS = () => { if (!(document.fullscreenElement || document.webkitFullscreenElement)) { try { screen.orientation.unlock(); } catch (e) {} } if (typeof syncQ === 'function') syncQ(); };
document.addEventListener('fullscreenchange', onFS);
document.addEventListener('webkitfullscreenchange', onFS);

// ---- Compartir y buscar ----
function share(m){
  const url = APP_URL + '?m=' + encodeURIComponent(m.id);
  const done = () => toast('Enlace copiado');
  const fallback = () => { const t = document.createElement('textarea'); t.value = url; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch (e) { toast(url); } t.remove(); };
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, fallback); else fallback();
}
function openSearch(){ $('#search').classList.add('open'); document.body.style.overflow = 'hidden'; $('#q').focus(); doSearch(); }
function closeSearch(){ $('#search').classList.remove('open'); if (!isFS()) document.body.style.overflow = ''; }
function doSearch(){
  const q = norm($('#q').value.trim());
  const list = DATA.filter(m => !q || norm([m.title, m.group, fmtDate(m.date), m.jornada ? 'j' + m.jornada + ' jornada ' + m.jornada : ''].join(' ')).includes(q));
  $('#results').innerHTML = list.length ? list.map(card).join('') : '<div class="center" style="min-height:0;padding:40px 0">Sin resultados</div>';
  bind($('#results'));
}
function setTab(id){ ['tHome', 'tSeason'].forEach(t => $('#' + t).classList.toggle('on', t === id)); }

// ---- Datos ----
const DEMO_SRC = 'data:text/html;charset=utf-8,' + encodeURIComponent('<body style="margin:0;height:100vh;display:grid;place-items:center;background:#000;color:#a7b0bc;font:600 18px system-ui;text-align:center">DEMO<br><span style="font-weight:400;font-size:14px">Aquí se reproducirá el vídeo del partido desde Drive</span></body>');
const SAMPLE = [['Anguera vs Bufala', 7], ['Badalona vs Anguera', 6], ['Anguera vs Sant Andreu', 5], ['Singuerlín vs Anguera', 4], ['Anguera vs Lloreda', 3], ['Gramanet VS Anguera', 2], ['Anguera vs Sistrells', 1]]
  .map((a, i) => ({ id: 'demo' + i, title: a[0], jornada: a[1], group: 'T26/27 S8', date: null, score: null, sort: 10 - i, videos: [1, 2, 3, 4].map(q => ({ id: 'd' + i + q, name: q + 'QUART.mp4', size: 0 })) }));
function route(){
  const p = new URLSearchParams(location.search), id = p.get('m');
  if (id) { const m = DATA.find(x => x.id === id); if (m) return openMatch(m, true); }
  if (p.get('v') === 'temporada') return renderSeason();
  renderHome();
}
function load(){
  $('#app').innerHTML = '<div class="skel" style="height:520px;border-radius:0"></div><div style="display:flex;gap:12px;padding:26px 18px"><div class="skel" style="flex:0 0 260px;height:230px"></div><div class="skel" style="flex:0 0 260px;height:230px"></div></div>';
  fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(res => { if (!res.matches || !res.matches.length) throw 0; return res.matches; })
    .catch(() => { DEMO = true; document.body.classList.add('demo'); return SAMPLE; })
    .then(list => { DATA = list; route(); setTimeout(() => $('#splash').classList.add('off'), 200); });
}

// ---- Eventos ----
$('#home').addEventListener('click', () => renderHome(true));
$('#tHome').addEventListener('click', () => renderHome(true));
$('#tSeason').addEventListener('click', () => renderSeason(true));
$('#tSearch').addEventListener('click', openSearch);
$('#openSearch').addEventListener('click', openSearch);
$('#closeSearch').addEventListener('click', closeSearch);
$('#q').addEventListener('input', doSearch);
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (document.querySelector('.stage.pfs')) exitFS(); else if ($('#search').classList.contains('open')) closeSearch(); else if (view === 'watch') renderHome(true); });
window.addEventListener('scroll', () => $('#top').classList.toggle('solid', scrollY > 40), { passive: true });
window.addEventListener('popstate', route);
load();

// ---- Aviso de instalación (solo si no está instalada) ----
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let deferred = null;
function showSheet(){
  if (standalone || store.get('atv_hide_install')) return;
  $('#steps').innerHTML = ios
    ? '<li>Pulsa <b>Compartir</b> en la barra de Safari.</li><li>Elige <b>Añadir a pantalla de inicio</b>.</li><li>Pulsa <b>Añadir</b>.</li>'
    : deferred ? '<li>Pulsa <b>Instalar</b> y confirma.</li>'
    : '<li>Abre el menú <b>⋮</b> del navegador.</li><li>Elige <b>Instalar aplicación</b> o <b>Añadir a pantalla de inicio</b>.</li>';
  $('#install').hidden = !deferred;
  $('#sheet').classList.add('on');
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; if ($('#sheet').classList.contains('on')) showSheet(); });
$('#install').addEventListener('click', async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice.catch(() => {}); deferred = null; $('#sheet').classList.remove('on'); });
$('#later').addEventListener('click', () => { store.set('atv_hide_install', '1'); $('#sheet').classList.remove('on'); });
if (/android|iphone|ipad|ipod/i.test(navigator.userAgent) || ios) setTimeout(showSheet, 4000);
}

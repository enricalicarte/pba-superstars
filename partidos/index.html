<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>PB Anguera TV</title>
<meta name="theme-color" content="#07090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anguera TV">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Envoltorio instalable de PB Anguera TV: carga la plataforma de Apps Script a pantalla completa. */
:root{--bg:#07090b;--s1:#111418;--ink:#f4f5f7;--mute:#9aa3ad;--acc:#ffd23f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;padding-top:env(safe-area-inset-top);background:var(--bg)}
.splash{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:2;transition:opacity .4s}
.splash.off{opacity:0;pointer-events:none}
.splash img{width:96px;height:96px;border-radius:22px;animation:p 1.4s ease-in-out infinite}
@keyframes p{50%{transform:scale(.92);opacity:.7}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:3;background:var(--s1);border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px #000a;transform:translateY(110%);transition:transform .35s}
.sheet.on{transform:none}
.sheet h2{margin:0 0 6px;font-size:20px}
.sheet p{margin:0 0 14px;color:var(--mute);font-size:15px}
.sheet ol{margin:0 0 16px;padding-left:20px}
.sheet li{margin:6px 0}
.sheet b{color:var(--ink)}
.row{display:flex;gap:10px}
.btn{flex:1;height:48px;border-radius:12px;border:0;font:700 16px system-ui,sans-serif;cursor:pointer;background:#22272e;color:var(--ink)}
.btn.pri{background:var(--acc);color:#141100}
.ico{display:inline-block;vertical-align:-3px}
.cfg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){.splash img{animation:none}.sheet{transition:none}}
</style>
</head>
<body>
<div class="splash" id="splash"><img src="icons/icon-192.png" alt="PB Anguera TV"></div>
<iframe id="app" title="PB Anguera TV" allow="autoplay; fullscreen; clipboard-write" allowfullscreen></iframe>

<div class="sheet" id="sheet" role="dialog" aria-label="Instalar la app">
  <h2>Instala PB Anguera TV</h2>
  <p>Tendrás los partidos en la pantalla de inicio, como una app.</p>
  <ol id="steps"></ol>
  <div class="row"><button class="btn" id="later">Ahora no</button><button class="btn pri" id="install" hidden>Instalar</button></div>
</div>

<script>
{
// ⬇️ Pega aquí la URL de tu aplicación web de Apps Script (termina en /exec)
const APPS_SCRIPT_URL = 'PEGA_AQUI_LA_URL_DE_APPS_SCRIPT';

const $ = s => document.getElementById(s);
const store = { get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} } };
const frame = $('app');

if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(APPS_SCRIPT_URL)) {
  // Mientras no esté conectada a Drive, enseña la demo con partidos de ejemplo
  frame.src = 'demo.html';
  frame.addEventListener('load', () => setTimeout(() => $('splash').classList.add('off'), 250));
} else {
  // Pasa el partido compartido (?m=ID) a la plataforma
  const m = new URLSearchParams(location.search).get('m');
  frame.src = APPS_SCRIPT_URL + (m ? '?m=' + encodeURIComponent(m) : '');
  frame.addEventListener('load', () => setTimeout(() => $('splash').classList.add('off'), 250));
  setTimeout(() => $('splash').classList.add('off'), 6000);
}

// Aviso de instalación (solo si no está ya instalada)
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let deferred = null;
const share = '<svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 8l5-5 5 5M5 12v8h14v-8"/></svg>';
function showSheet(){
  if (standalone || store.get('atv_hide_install')) return;
  $('steps').innerHTML = ios
    ? '<li>Pulsa <b>Compartir</b> ' + share + ' en la barra de Safari.</li><li>Elige <b>Añadir a pantalla de inicio</b>.</li><li>Pulsa <b>Añadir</b>.</li>'
    : deferred ? '<li>Pulsa <b>Instalar</b> y confirma.</li>'
    : '<li>Abre el menú <b>⋮</b> del navegador.</li><li>Elige <b>Instalar aplicación</b> o <b>Añadir a pantalla de inicio</b>.</li>';
  $('install').hidden = !deferred;
  $('sheet').classList.add('on');
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; if ($('sheet').classList.contains('on')) showSheet(); });
$('install').addEventListener('click', async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice.catch(() => {}); deferred = null; $('sheet').classList.remove('on'); });
$('later').addEventListener('click', () => { store.set('atv_hide_install', '1'); $('sheet').classList.remove('on'); });
if (/android|iphone|ipad|ipod/i.test(navigator.userAgent) || ios) setTimeout(showSheet, 3500);
}
</script>
</body>
</html>

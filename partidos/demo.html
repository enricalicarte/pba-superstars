<!DOCTYPE html>
<html lang="es">
<head>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PB Anguera TV · Demo</title>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: plataforma de streaming deportivo, noche de partido. IDEA: la app de TV del club.
   PICTURE: héroe a sangre con el último partido + filas deslizables de fotogramas.
   COLOUR: negro profundo, grafito, amarillo del club como único acento. TYPE: Barlow Condensed 900 + Barlow.
   LAYOUT: barra superior fija, héroe 60vh, carriles horizontales, página de partido con vídeo arriba. */
:root{--bg:#07090b;--s1:#111418;--s2:#1a1e24;--line:rgba(255,255,255,.1);--ink:#f4f5f7;--mute:#9aa3ad;--acc:#ffd23f;--accInk:#141100}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.disp{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.01em}

/* Barra superior */
.top{position:fixed;inset:0 0 auto;z-index:30;display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 10px) max(4vw,14px) 10px;background:linear-gradient(#07090bee,#07090b00);transition:background .2s}
.top.solid{background:#07090bf2;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font:900 22px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;white-space:nowrap;cursor:pointer;background:none;border:0;padding:0}
.logo b{background:var(--acc);color:var(--accInk);padding:3px 6px 2px;border-radius:4px}
.nav{display:flex;gap:4px;margin-left:8px;overflow-x:auto}
.nav button{background:none;border:0;color:var(--mute);font-weight:600;padding:8px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.nav button.on{color:var(--ink)}
.sp{flex:1}
.icon{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;flex:none}
.icon:hover{background:var(--s2)}
@media(max-width:640px){.nav{display:none}}

/* Héroe */
.hero{position:relative;min-height:max(62vh,440px);display:flex;align-items:flex-end;overflow:hidden;background:var(--s1)}
.hero .bg{position:absolute;inset:0;background:radial-gradient(120% 90% at 75% 20%,#2b3a1c,#0b0f0a 70%)}
.hero .bg img{width:100%;height:100%;object-fit:cover;opacity:.75}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#07090b 0%,#07090bcc 35%,transparent 75%),linear-gradient(0deg,#07090b 2%,transparent 45%)}
.hero .in{position:relative;z-index:1;padding:110px max(4vw,14px) 44px;max-width:720px}
.tag{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--acc);margin-bottom:12px}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px #ffd23f33}
.vs{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0}
.vs .t{font:900 clamp(36px,7vw,64px)/.95 'Barlow Condensed',sans-serif;text-transform:uppercase;text-wrap:balance}
.vs .x{font:800 18px 'Barlow Condensed',sans-serif;color:var(--accInk);background:var(--acc);border-radius:6px;padding:4px 8px}
.hmeta{color:var(--mute);margin:14px 0 22px;font-weight:500}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{height:48px;padding:0 20px;border-radius:10px;border:0;background:var(--s2);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:10px;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--acc);color:var(--accInk)}
.btn:hover{filter:brightness(1.1)}

/* Carriles */
.rails{padding:8px 0 60px}
.rail{margin-top:26px}
.rhead{display:flex;align-items:center;gap:10px;padding:0 max(4vw,14px);margin-bottom:12px}
.rhead h2{font:800 24px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:0;flex:1}
.rhead .ar{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--s1);cursor:pointer}
@media(max-width:640px){.rhead .ar{display:none}}
.row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px max(4vw,14px) 10px;scroll-padding-inline:max(4vw,14px);scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.tile{flex:0 0 clamp(230px,26vw,320px);scroll-snap-align:start;all:unset;flex:0 0 clamp(230px,26vw,320px);cursor:pointer;scroll-snap-align:start}
.tile .im{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#1e2b18,#0e130c);box-shadow:0 0 0 1px var(--line) inset;transition:transform .2s,box-shadow .2s}
.tile:hover .im,.tile:focus-visible .im{transform:scale(1.03);box-shadow:0 0 0 2px var(--acc) inset}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .pitch{position:absolute;inset:0;width:100%;height:100%;opacity:.25}
.badge{position:absolute;left:8px;top:8px;background:#000c;font:800 13px/1 'Barlow Condensed',sans-serif;padding:6px 7px;border-radius:5px;letter-spacing:.04em;white-space:nowrap}
.badge.y{background:var(--acc);color:var(--accInk)}
.dur{position:absolute;right:8px;bottom:8px;background:#000c;font-size:12px;font-weight:600;padding:3px 7px;border-radius:5px;white-space:nowrap}
.seen{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--acc)}
.play{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .2s}
.tile:hover .play{opacity:1}
.play span{width:54px;height:54px;border-radius:50%;background:#000a;display:grid;place-items:center;border:2px solid #fff}
.tile .tt{font-weight:700;margin-top:9px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .ts{color:var(--mute);font-size:13px}

/* Página de partido */
.watch{padding-top:calc(env(safe-area-inset-top) + 66px)}
.stage{width:100%;max-width:1280px;margin:0 auto;aspect-ratio:16/9;background:#000;position:relative}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.winfo{max-width:1280px;margin:0 auto;padding:20px max(4vw,14px) 0;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px}
@media(max-width:820px){.winfo{grid-template-columns:minmax(0,1fr)}}
.winfo h1{font:900 clamp(28px,5vw,44px)/1 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:6px 0 8px;text-wrap:balance}
.part{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--s1);cursor:pointer;text-align:left;margin-bottom:8px}
.part.on{border-color:var(--acc)}
.part .mini{width:96px;flex:none;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--s2)}
.part .mini img{width:100%;height:100%;object-fit:cover;display:block}
.part .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.part .sz{color:var(--mute);font-size:13px;white-space:nowrap}
.lbl{color:var(--mute);font-weight:700;font-size:13px;margin:0 0 10px}

/* Buscar */
.search{position:fixed;inset:0;z-index:40;background:#07090bf7;display:none;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 16px) max(4vw,14px) 40px}
.search.open{display:block}
.sbar{display:flex;gap:10px;max-width:1280px;margin:0 auto 22px}
.sbar input{flex:1;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--s1);padding:0 16px;font-size:17px}
.grid{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:18px 12px}
.grid .tile{flex:none;width:auto;display:block}

.center{min-height:80vh;display:grid;place-items:center;text-align:center;padding:100px 20px;color:var(--mute)}
.pin{width:min(340px,100%)}
.pin input{width:100%;height:58px;text-align:center;font-size:26px;letter-spacing:.3em;border-radius:12px;border:1px solid var(--line);background:var(--s1);margin:16px 0 8px}
.err{color:#ff8a7a;min-height:22px;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top" id="top">
  <button class="logo" id="home" aria-label="Inicio"><span>PB Anguera</span><b>TV</b></button><span style="font:700 12px system-ui;color:#141100;background:#9aa3ad;border-radius:5px;padding:3px 6px">DEMO</span>
  <nav class="nav" id="nav"></nav>
  <div class="sp"></div>
  <button class="icon" id="openSearch" aria-label="Buscar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
</header>

<main id="app"><div class="center">Cargando partidos…</div></main>

<section class="search" id="search" role="dialog" aria-label="Buscar partidos">
  <div class="sbar"><input id="q" type="search" placeholder="Busca rival, fecha, temporada…" aria-label="Buscar"><button class="btn" id="closeSearch">Cerrar</button></div>
  <div class="grid" id="results"></div>
</section>
<div class="toast" id="toast"></div>

<script>
(()=>{const D=(y,m,d)=>new Date(y,m-1,d).getTime();const v=(n,k)=>Array.from({length:n},(_,i)=>({id:k+i,name:(n>1?(i+1)+'a part':'Partit complet')+'.mp4',size:(380+i*40)*1e6,created:0}));
const M=[["PB Anguera vs Sant Andreu",D(2026,11,22),"Temporada 2026-27",2],["CF Badalona vs PB Anguera",D(2026,11,15),"Temporada 2026-27",2],["PB Anguera vs Gramenet",D(2026,11,8),"Temporada 2026-27",3],["Europa vs PB Anguera",D(2026,10,25),"Temporada 2026-27",2],["PB Anguera vs Damm",D(2026,10,18),"Temporada 2026-27",2],["Torneig de Tardor - Final",D(2026,10,12),"Torneos",1],["PB Anguera vs Sabadell",D(2026,10,4),"Temporada 2026-27",2],["Amistós vs Montcada",D(2026,9,20),"Amistosos",1]].map((a,i)=>({id:'m'+i,title:a[0],date:a[1],sort:a[1],group:a[2],videos:v(a[3],'v'+i+'_')}));
const run={_s:null,_f:null,withSuccessHandler(f){this._s=f;return this},withFailureHandler(f){this._f=f;return this},getMatches(){const s=this._s;setTimeout(()=>s({matches:M}),300)}};
window.google={script:{run,history:{push(){},setChangeHandler(){}},url:{getLocation(cb){cb({parameter:{}})}}}};})();
</script>
<script>
{
const APP_URL = "https://script.google.com/demo";
const TEAM = "PB Anguera";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const MONTHS = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const MONTHS_L = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let DATA = [], pin = store.get('partidos_pin') || '', view = 'home', group = '', current = null, startId = null;
let seen = (() => { try { return JSON.parse(store.get('partidos_seen') || '[]'); } catch (e) { return []; } })();

const fmtDate = ms => { if (!ms) return ''; const d = new Date(ms); return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); };
const fmtSize = b => b > 1e9 ? (b / 1e9).toFixed(1) + ' GB' : Math.round(b / 1e6) + ' MB';
const thumb = (id, w) => 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + (w || 640);
const pitch = '<svg class="pitch" viewBox="0 0 160 90" preserveAspectRatio="none" aria-hidden="true"><rect x="6" y="6" width="148" height="78" fill="none" stroke="#fff"/><line x1="80" y1="6" x2="80" y2="84" stroke="#fff"/><circle cx="80" cy="45" r="13" fill="none" stroke="#fff"/><rect x="6" y="28" width="18" height="34" fill="none" stroke="#fff"/><rect x="136" y="28" width="18" height="34" fill="none" stroke="#fff"/></svg>';
const playIco = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>';
// "PB Anguera vs Sant Andreu" -> ["PB Anguera","Sant Andreu"]
const teams = t => { const p = String(t).split(/\s+(?:vs\.?|v|contra|-|–)\s+/i); return p.length === 2 ? p : null; };
const isNew = m => Date.now() - m.sort < 8 * 864e5;

function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 1800); }

function tile(m){
  const s = seen.includes(m.id);
  return '<button class="tile" data-id="' + esc(m.id) + '"><div class="im">' + pitch +
    '<img loading="lazy" alt="" src="' + thumb(m.videos[0].id) + '" onerror="this.remove()">' +
    (isNew(m) && !s ? '<span class="badge y">NUEVO</span>' : (m.date ? '<span class="badge">' + esc(fmtDate(m.date)) + '</span>' : '')) +
    '<span class="dur">' + m.videos.length + (m.videos.length === 1 ? ' vídeo' : ' partes') + '</span>' +
    '<span class="play"><span>' + playIco + '</span></span>' + (s ? '<span class="seen"></span>' : '') +
    '</div><div class="tt">' + esc(m.title) + '</div><div class="ts">' + esc([m.group, m.date && isNew(m) && !s ? fmtDate(m.date) : ''].filter(Boolean).join(' · ') || ' ') + '</div></button>';
}

function rail(title, list, id){
  if (!list.length) return '';
  return '<section class="rail"><div class="rhead"><h2>' + esc(title) + '</h2><button class="ar" data-dir="-1" data-r="' + id + '" aria-label="Anterior">‹</button><button class="ar" data-dir="1" data-r="' + id + '" aria-label="Siguiente">›</button></div><div class="row" id="' + id + '">' + list.map(tile).join('') + '</div></section>';
}

function bindTiles(root){
  root.querySelectorAll('.tile').forEach(t => t.addEventListener('click', () => openMatch(DATA.find(m => m.id === t.dataset.id))));
  root.querySelectorAll('.ar').forEach(b => b.addEventListener('click', () => { const r = document.getElementById(b.dataset.r); r.scrollBy({ left: +b.dataset.dir * r.clientWidth * .85, behavior: 'smooth' }); }));
  root.querySelectorAll('.row').forEach(r => r.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); r.scrollBy({ left: (e.key === 'ArrowRight' ? 1 : -1) * r.clientWidth * .85, behavior: 'smooth' }); } }));
}

function heroHTML(m){
  const tm = teams(m.title);
  return '<section class="hero"><div class="bg"><img alt="" src="' + thumb(m.videos[0].id, 1600) + '" onerror="this.remove()"></div><div class="in">' +
    '<div class="tag"><i></i>' + (isNew(m) ? 'ÚLTIMO PARTIDO · NUEVO' : 'ÚLTIMO PARTIDO') + '</div>' +
    (tm ? '<h1 class="vs"><span class="t">' + esc(tm[0]) + '</span><span class="x">VS</span><span class="t">' + esc(tm[1]) + '</span></h1>' : '<h1 class="vs"><span class="t">' + esc(m.title) + '</span></h1>') +
    '<div class="hmeta">' + esc([fmtDate(m.date), m.group, m.videos.length + (m.videos.length === 1 ? ' vídeo' : ' partes')].filter(Boolean).join('  ·  ')) + '</div>' +
    '<div class="btns"><button class="btn pri" id="heroPlay">' + playIco + 'Ver partido</button><button class="btn" id="heroShare">Compartir</button></div></div></section>';
}

function renderNav(){
  const groups = [...new Set(DATA.map(m => m.group).filter(Boolean))];
  $('#nav').innerHTML = ['', ...groups].map(g => '<button data-g="' + esc(g) + '" class="' + (view === 'home' && g === group ? 'on' : '') + '">' + esc(g || 'Inicio') + '</button>').join('');
  $('#nav').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { group = b.dataset.g; goHome(true); }));
}

function renderHome(){
  view = 'home'; current = null;
  renderNav();
  const list = DATA.filter(m => !group || m.group === group);
  if (!list.length) { $('#app').innerHTML = '<div class="center">Todavía no hay vídeos en la carpeta.</div>'; return; }
  const feat = list[0];
  const cont = seen.map(id => list.find(m => m.id === id)).filter(Boolean).slice(0, 12);
  const pending = list.filter(m => !seen.includes(m.id));
  const byMonth = [];
  list.forEach(m => { const d = new Date(m.sort); const k = MONTHS_L[d.getMonth()] + ' ' + d.getFullYear(); let g = byMonth.find(x => x.k === k); if (!g) byMonth.push(g = { k, items: [] }); g.items.push(m); });
  const groups = group ? [] : [...new Set(DATA.map(m => m.group).filter(Boolean))];
  let html = heroHTML(feat) + '<div class="rails">';
  html += rail('Últimos partidos', list.slice(0, 12), 'r-last');
  html += rail('Sigue viendo', cont, 'r-cont');
  html += pending.length && pending.length < list.length ? rail('Aún no los has visto', pending, 'r-pend') : '';
  html += groups.map((g, i) => rail(g, DATA.filter(m => m.group === g), 'r-g' + i)).join('');
  html += byMonth.length > 1 ? byMonth.map((g, i) => rail(g.k, g.items, 'r-m' + i)).join('') : '';
  html += '<div style="text-align:center;padding:30px 0 0"><button class="btn" id="reload">Buscar vídeos nuevos en Drive</button></div></div>';
  $('#app').innerHTML = html;
  $('#heroPlay').addEventListener('click', () => openMatch(feat));
  $('#heroShare').addEventListener('click', () => share(feat));
  $('#reload').addEventListener('click', () => load(true));
  bindTiles($('#app'));
  window.scrollTo(0, 0);
}

function openMatch(m, noPush){
  if (!m) return;
  closeSearch();
  view = 'watch'; current = m;
  renderNav();
  if (!seen.includes(m.id)) { seen = [m.id, ...seen].slice(0, 200); store.set('partidos_seen', JSON.stringify(seen)); }
  else { seen = [m.id, ...seen.filter(x => x !== m.id)]; store.set('partidos_seen', JSON.stringify(seen)); }
  const tm = teams(m.title);
  const more = DATA.filter(x => x.id !== m.id && (!m.group || x.group === m.group)).slice(0, 14);
  $('#app').innerHTML = '<div class="watch"><div class="stage"><iframe id="frame" allow="autoplay; fullscreen" allowfullscreen title="Vídeo del partido"></iframe></div>' +
    '<div class="winfo"><div><div class="tag"><i></i>' + esc([fmtDate(m.date), m.group].filter(Boolean).join(' · ') || 'PARTIDO') + '</div>' +
    '<h1>' + (tm ? esc(tm[0]) + ' <span style="color:var(--acc)">vs</span> ' + esc(tm[1]) : esc(m.title)) + '</h1>' +
    '<div class="btns" style="margin-top:16px"><button class="btn pri" id="share">Copiar enlace</button><a class="btn" id="open" target="_blank" rel="noopener">Abrir en Drive</a><button class="btn" id="back">← Volver</button></div></div>' +
    '<div>' + (m.videos.length > 1 ? '<p class="lbl">PARTES DEL PARTIDO</p>' + m.videos.map((v, i) =>
      '<button class="part" data-i="' + i + '"><span class="mini"><img loading="lazy" alt="" src="' + thumb(v.id, 320) + '" onerror="this.remove()"></span><span class="nm">' + esc(v.name.replace(/\.[^.]+$/, '')) + '</span><span class="sz">' + fmtSize(v.size) + '</span></button>').join('') : '') + '</div></div>' +
    '<div class="rails">' + rail('Más partidos', more, 'r-more') + '</div></div>';
  document.querySelectorAll('.part').forEach(p => p.addEventListener('click', () => play(+p.dataset.i)));
  $('#share').addEventListener('click', () => share(m));
  $('#back').addEventListener('click', () => goHome(true));
  bindTiles($('#app'));
  play(0);
  window.scrollTo(0, 0);
  if (!noPush) try { google.script.history.push({ m: m.id }, { m: m.id }); } catch (e) {}
}

function play(i){
  const v = current.videos[i];
  $('#frame').src = 'data:text/html;charset=utf-8,%3Cbody%20style%3D%22margin%3A0%3Bheight%3A100vh%3Bdisplay%3Agrid%3Bplace-items%3Acenter%3Bbackground%3A%23000%3Bcolor%3A%239aa3ad%3Bfont%3A600%2018px%20system-ui%3Btext-align%3Acenter%22%3EDEMO%3Cbr%3E%3Cspan%20style%3D%22font-weight%3A400%3Bfont-size%3A14px%22%3EAqu%C3%AD%20se%20reproducir%C3%A1%20el%20v%C3%ADdeo%20del%20partido%20desde%20Drive%3C/span%3E%3C/body%3E';
  $('#open').href = 'https://drive.google.com/file/d/' + encodeURIComponent(v.id) + '/view';
  document.querySelectorAll('.part').forEach(p => p.classList.toggle('on', +p.dataset.i === i));
}

function goHome(push){ renderHome(); if (push) try { google.script.history.push({}, {}); } catch (e) {} }

function share(m){
  const url = APP_URL + '?m=' + encodeURIComponent(m.id);
  const done = () => toast('Enlace copiado');
  const fallback = () => { const t = document.createElement('textarea'); t.value = url; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch (e) { toast(url); } t.remove(); };
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, fallback); else fallback();
}

function openSearch(){ $('#search').classList.add('open'); document.body.style.overflow = 'hidden'; $('#q').focus(); doSearch(); }
function closeSearch(){ $('#search').classList.remove('open'); document.body.style.overflow = ''; }
function doSearch(){
  const q = $('#q').value.trim().toLowerCase();
  const list = DATA.filter(m => !q || (m.title + ' ' + m.group + ' ' + fmtDate(m.date) + ' ' + m.videos.map(v => v.name).join(' ')).toLowerCase().includes(q));
  $('#results').innerHTML = list.length ? list.map(tile).join('') : '<div class="center" style="min-height:0;padding:40px 0">Sin resultados</div>';
  bindTiles($('#results'));
}

function showPin(error){
  $('#app').innerHTML = '<div class="center"><form class="pin" id="pinf"><div class="logo" style="justify-content:center;font-size:30px"><span>' + esc(TEAM) + '</span><b>TV</b></div><p>Introduce el PIN de las familias</p><input id="pinv" inputmode="numeric" autocomplete="off" aria-label="PIN"><div class="err">' + esc(error) + '</div><button class="btn pri" style="width:100%;justify-content:center">Entrar</button></form></div>';
  $('#pinv').focus();
  $('#pinf').addEventListener('submit', e => { e.preventDefault(); pin = $('#pinv').value.trim(); load(); });
}

function load(force){
  $('#app').innerHTML = '<div class="center">Cargando partidos…</div>';
  google.script.run
    .withSuccessHandler(res => {
      store.set('partidos_pin', pin);
      DATA = res.matches || [];
      const m = startId && DATA.find(x => x.id === startId); startId = null;
      if (m) openMatch(m, true); else renderHome();
      if (force) toast('Partidos actualizados');
    })
    .withFailureHandler(err => {
      if (String(err && err.message).includes('PIN_INCORRECTO')) showPin(pin ? 'PIN incorrecto' : '');
      else $('#app').innerHTML = '<div class="center">No se han podido cargar los vídeos.<br>' + esc(err && err.message) + '</div>';
    })
    .getMatches(pin, !!force);
}

$('#home').addEventListener('click', () => { group = ''; goHome(true); });
$('#openSearch').addEventListener('click', openSearch);
$('#closeSearch').addEventListener('click', closeSearch);
$('#q').addEventListener('input', doSearch);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#search').classList.contains('open')) closeSearch(); else if (view === 'watch') goHome(true); } });
window.addEventListener('scroll', () => $('#top').classList.toggle('solid', scrollY > 40), { passive: true });

try {
  google.script.history.setChangeHandler(e => { const id = e.location.parameter.m; if (!id) renderHome(); else if (!current || current.id !== id) openMatch(DATA.find(m => m.id === id), true); });
  google.script.url.getLocation(loc => { startId = loc.parameter.m || null; load(); });
} catch (e) { load(); }
}
</script>
